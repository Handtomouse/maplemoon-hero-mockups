<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Maple Moon founder v04 review</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --blue: #c5d5e5;
      --blue-deep: #315f73;
      --paper: #f7f6f2;
      --ink: #2c2a26;
      --muted: #6e6d68;
      --warm: #c6a66a;
      --rule: rgba(44, 42, 38, .15);
      --serif: Georgia, "Times New Roman", serif;
      --sans: Arial, Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); color: var(--ink); }
    body { margin: 0; overflow-x: hidden; font-family: var(--sans); }
    figure { margin: 0; }
    img { display: block; width: 100%; }
    a { color: inherit; text-decoration: none; }
    .topbar {
      height: 74px;
      border-bottom: 1px solid var(--rule);
      background: var(--blue);
    }
    .topbar__inner {
      width: min(1180px, calc(100% - 48px));
      height: 100%;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .nav { display: flex; gap: 26px; font-size: 11px; text-transform: uppercase; }
    .nav--right { justify-content: flex-end; }
    .brand { font-family: var(--serif); font-size: 24px; }
    .hero { background: var(--blue); }
    .hero__inner {
      width: min(1180px, calc(100% - 48px));
      min-height: 620px;
      margin: auto;
      display: grid;
      grid-template-columns: minmax(320px, .8fr) minmax(520px, 1.2fr);
      gap: 68px;
      align-items: center;
      padding: 68px 0 84px;
    }
    .eyebrow {
      display: block;
      margin-bottom: 20px;
      color: #8c764f;
      font-size: 11px;
      text-transform: uppercase;
    }
    h1, h2, h3 { margin: 0; font-family: var(--serif); font-weight: 400; }
    h1 { max-width: 520px; font-size: clamp(58px, 6vw, 88px); line-height: .98; }
    .hero__copy p { max-width: 440px; color: var(--muted); line-height: 1.65; }
    .actions { display: flex; gap: 12px; margin-top: 30px; }
    .button {
      min-height: 46px;
      padding: 0 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--ink);
      border-radius: 999px;
      font-size: 11px;
      text-transform: uppercase;
    }
    .button--solid { background: var(--ink); color: var(--paper); }
    .hero__image { aspect-ratio: 3 / 2; overflow: hidden; }
    .hero__image img { height: 100%; object-fit: cover; }
    .profiles { background: var(--paper); padding: 96px 0 112px; }
    .profiles__inner {
      width: min(1180px, calc(100% - 48px));
      margin: auto;
      display: grid;
      grid-template-columns: minmax(240px, .7fr) repeat(2, minmax(260px, 1fr));
      gap: 28px;
      align-items: start;
    }
    .profiles__intro { padding: 28px 28px 0 0; }
    .profiles__intro h2 { margin-bottom: 18px; font-size: 44px; line-height: 1.05; }
    .profiles__intro p { color: var(--muted); line-height: 1.65; }
    .profile {
      overflow: hidden;
      border: 1px solid var(--rule);
      border-radius: 6px;
      background: #fff;
    }
    .profile img { aspect-ratio: 4 / 5; object-fit: cover; }
    .profile figcaption { padding: 18px 20px 20px; }
    .profile h3 { font-size: 30px; }
    .profile span { color: var(--blue-deep); font-size: 10px; text-transform: uppercase; }
    @media (max-width: 850px) {
      .nav a:not(:first-child) { display: none; }
      .topbar__inner, .hero__inner, .profiles__inner { width: min(100% - 32px, 640px); }
      .hero__inner { min-height: 0; grid-template-columns: 1fr; gap: 36px; padding: 48px 0 56px; }
      h1 { font-size: 58px; }
      .hero__image { order: -1; }
      .profiles { padding: 64px 0 72px; }
      .profiles__inner { grid-template-columns: 1fr; }
      .profiles__intro { padding: 0 0 12px; }
      .profile { width: 100%; }
    }
    @media (max-width: 430px) {
      .topbar__inner { grid-template-columns: 1fr auto; }
      .nav--right { display: none; }
      .brand { justify-self: end; }
      .actions { flex-direction: column; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <nav class="nav" aria-label="Primary"><a href="#profiles">Our story</a><a href="#profiles">Founders</a></nav>
      <a class="brand" href="#">maple moon</a>
      <nav class="nav nav--right" aria-label="Secondary"><a href="#profiles">Stockists</a><a href="#profiles">Shop</a></nav>
    </div>
  </header>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__inner">
        <div class="hero__copy">
          <span class="eyebrow">The makers</span>
          <h1 id="hero-title">Carli &amp;<br>Dylan.</h1>
          <p>Meet the people behind Maple Moon and the ideas shaping its slow, thoughtful rituals.</p>
          <div class="actions"><a class="button button--solid" href="#profiles">Read our story</a><a class="button" href="#profiles">Meet the founders</a></div>
        </div>
        <figure class="hero__image"><img src="founders_portrait_v04_review.png" alt="Carli and Dylan, founders of Maple Moon"></figure>
      </div>
    </section>
    <section class="profiles" id="profiles" aria-labelledby="profiles-title">
      <div class="profiles__inner">
        <div class="profiles__intro">
          <span class="eyebrow">The heart behind Maple Moon</span>
          <h2 id="profiles-title">Carli &amp; Dylan</h2>
          <p>Pair portrait and individual founder selections for review.</p>
        </div>
        <figure class="profile"><img src="carli_bio_v02.png" alt="Carli"><figcaption><h3>Carli</h3><span>Co-founder</span></figcaption></figure>
        <figure class="profile"><img src="dylan_bio_v01.png" alt="Dylan"><figcaption><h3>Dylan</h3><span>Co-founder</span></figcaption></figure>
      </div>
    </section>
  </main>
</body>
</html>
