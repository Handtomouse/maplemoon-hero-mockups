<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#c5d5e5;font:12px system-ui}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.grid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:clamp(40px,6vw,90px);align-items:center;min-height:clamp(420px,52vw,576px)}
.portrait{position:relative;height:clamp(400px,46vw,548px);margin:0;overflow:visible}
.portrait img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;object-position:46% 40%;
-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 11%,#000 91%,transparent 100%),linear-gradient(180deg,transparent 0,#000 8%,#000 90%,transparent 100%);
-webkit-mask-composite:source-in;
mask-image:linear-gradient(90deg,transparent 0,#000 11%,#000 91%,transparent 100%),linear-gradient(180deg,transparent 0,#000 8%,#000 90%,transparent 100%);
mask-composite:intersect}
@media(max-width:820px){.grid{grid-template-columns:1fr;gap:28px;min-height:0}.portrait{height:min(118vw,560px)}
.portrait img{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 8%,#000 88%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 8%,#000 88%,transparent 100%)}}
.copy{padding:20px}
</style></head><body><div class="wrap"><div class="grid">
<div class="copy"><h1>Our Story</h1><p>Production CSS replica: object-fit cover, object-position 46% 40%, two-axis alpha mask per our-story.WIP.html lines 543 and 603.</p></div>
<figure class="portrait"><img src="founder_v04_main_imac_qa_export_20260803/carli_bio_v02.png" alt="Carli"></figure>
</div></div></body></html>
