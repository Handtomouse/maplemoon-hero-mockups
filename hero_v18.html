<style>

  :root {
    --light-bg: #F0EDDF;
    --light-gold: #E1D78E;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--light-bg);
    font-family: var(--mm-sans);
    color: var(--mm-navy);
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* -- Fade-in -- */
  @media (prefers-reduced-motion: no-preference) {
    .fade-1 { animation: fadeIn 0.6s ease both 0.1s; }
    .fade-2 { animation: fadeIn 0.6s ease both 0.25s; }
    .fade-3 { animation: fadeIn 0.6s ease both 0.4s; }
    .fade-4 { animation: fadeIn 0.6s ease both 0.55s; }
    .fade-5 { animation: fadeIn 0.6s ease both 0.7s; }
    .fade-6 { animation: fadeIn 0.6s ease both 0.85s; }
    .fade-7 { animation: fadeIn 0.6s ease both 1.0s; }
  }

  /* -- Back link -- */
  .back-link {
    position: fixed; top: 12px; left: 56px; z-index: calc(var(--z-fixed) + 1);
    color: var(--mm-navy); text-decoration: none;
    font-family: var(--mm-sans); font-size: 0.8rem; font-weight: 400;
    opacity: 0.6; transition: opacity 0.2s;
    display: none; min-height: 44px; padding: 12px 8px;
  }
  .back-link:hover { opacity: 1; }

  /* -- Hamburger (mobile) -- */
  #menu-toggle { display: none; }

  .hamburger {
    position: fixed; top: 12px; left: 12px; z-index: var(--z-tooltip);
    cursor: pointer; display: flex; flex-direction: column;
    justify-content: center; gap: 5px; width: 44px; height: 44px;
    padding: 8px;
  }
  .hamburger span {
    display: block; width: 100%; height: 2px;
    background: var(--mm-navy); border-radius: 1px;
    transition: transform 0.3s, opacity 0.3s;
  }
  #menu-toggle:checked ~ .hamburger span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
  #menu-toggle:checked ~ .hamburger span:nth-child(2) { opacity: 0; }
  #menu-toggle:checked ~ .hamburger span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

  /* -- Mobile menu overlay -- */
  .mobile-menu {
    position: fixed; inset: 0; z-index: var(--z-modal);
    background: var(--mm-cream); color: var(--mm-navy);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 28px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #menu-toggle:checked ~ .mobile-menu { opacity: 1; pointer-events: auto; }

  .mobile-menu a {
    font-family: var(--mm-serif); font-size: 1.4rem;
    font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--mm-navy); text-decoration: none;
    transition: opacity 0.2s;
    min-height: 44px; padding: 12px 0;
    display: inline-flex; align-items: center;
  }
  .mobile-menu a:hover { opacity: 0.6; }

  .mobile-menu .menu-divider {
    width: 40px; height: 1px; background: var(--mm-navy); opacity: 0.2;
  }
  .mobile-menu .menu-nav {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    margin-top: 24px; padding-top: 24px;
    border-top: 1px solid var(--mm-navy-15);
  }
  .mobile-menu .menu-nav a {
    font-family: var(--mm-sans); font-size: 0.95rem;
    font-weight: 400; text-transform: none; letter-spacing: 0.02em;
    color: var(--mm-navy); opacity: 0.75;
  }

  #main-content:focus { outline: none; }

  .menu-close {
    position: absolute; top: 20px; right: 20px;
    background: none; border: none; cursor: pointer;
    font-size: 1.5rem; color: var(--mm-navy); opacity: 0.5;
    padding: 12px; min-width: 44px; min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s;
  }
  .menu-close:hover { opacity: 1; }

  /* -- Mobile header -- */
  .header-mobile {
    position: fixed; top: 0; left: 0; right: 0; z-index: var(--z-fixed);
    display: flex; justify-content: flex-end; align-items: flex-start;
    padding: 20px;
  }
  .header-mobile .logo-img { width: 40px; height: auto; }

  /* -- Desktop nav -- */
  .header-desktop { display: none; }

  /* =============================================
     HERO LAYOUT
     ============================================= */
  .hero {
    position: relative; width: 100%; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
    gap: 0;
    padding-top: 48px;
    z-index: var(--z-base);
  }

  /* Watermark (gold-tinted) */
  .carob-watermark-wrap img {
    filter: sepia(1) saturate(2) hue-rotate(-10deg) brightness(0.85);
    opacity: 0.12;
  }

  /* Product image stack */
  .product-stack {
    position: relative;
    width: 62%; max-width: 260px;
    height: 280px;
    z-index: var(--z-product);
  }
  .product-stack img {
    width: 100%; height: auto;
    object-fit: contain; object-position: center;
    filter: drop-shadow(0 12px 24px rgba(0,0,0,0.10))
            drop-shadow(0 4px 8px rgba(0,0,0,0.06));
    position: absolute; top: 0; left: 0;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .product-stack img.active { opacity: 1; position: relative; }

  /* Tagline */
  .tagline {
    font-family: var(--mm-sans); font-weight: 300;
    font-size: 0.9rem; color: var(--mm-carob-dark); opacity: 0.8;
    text-align: center; position: relative; z-index: var(--z-product);
    min-height: 1.4em;
    margin-top: 24px;
  }

  /* Category tabs */
  .category-tabs {
    display: flex; align-items: center; justify-content: center;
    gap: 0; z-index: var(--z-product);
    margin-top: 16px;
  }
  .category-tab {
    font-family: var(--mm-serif);
    font-size: 0.82rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--mm-navy); background: none; border: none;
    cursor: pointer; padding: 8px 4px; min-height: 44px;
    opacity: 0.35; transition: opacity 0.2s;
    -webkit-tap-highlight-color: transparent; white-space: nowrap;
    border-bottom: 1.5px solid transparent;
  }
  .category-tab.active { opacity: 1; border-bottom-color: var(--mm-navy); padding-bottom: 2px; }
  .category-tab:hover { opacity: 0.7; }
  .category-tab.active:hover { opacity: 1; }
  .category-tab:focus-visible {
    outline: 2px solid var(--mm-navy);
    outline-offset: 4px;
    border-radius: 2px;
  }
  .cat-dot {
    display: inline-block; width: 3px; height: 3px;
    background: var(--mm-navy); border-radius: var(--radius-full);
    margin: 0 12px; opacity: 0.2; flex-shrink: 0;
  }

  /* Flavour pills */
  .flavour-pills {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding: 4px 24px 4px 16px;
    z-index: var(--z-product);
    max-width: 100%;
    scrollbar-width: none;
    margin-top: 6px;
  }
  .flavour-pills::-webkit-scrollbar { display: none; }

  .flavour-pill {
    flex-shrink: 0;
    padding: 12px 22px;
    min-height: 48px;
    border: 1.5px solid var(--mm-navy);
    border-radius: var(--radius-pill);
    background: transparent;
    color: var(--mm-navy);
    opacity: 0.5;
    font-family: var(--mm-sans);
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.3s ease, color 0.3s ease, opacity 0.3s ease, border-color 0.3s ease;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .flavour-pill:hover { opacity: 0.8; }
  .flavour-pill.active {
    background: var(--light-gold);
    color: var(--mm-navy);
    opacity: 1;
    border-color: var(--light-gold);
  }
  .flavour-pill:focus-visible {
    outline: 2px solid var(--mm-navy);
    outline-offset: 4px;
  }

  /* CTA */
  .cta-btn {
    display: inline-block;
    border: 1.5px solid var(--mm-navy); color: var(--mm-navy);
    background: transparent; border-radius: var(--radius-pill);
    padding: 12px 32px;
    font-family: var(--mm-sans); font-size: 0.85rem;
    font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase;
    text-decoration: none; cursor: pointer;
    transition: background 0.3s, color 0.3s, border-color 0.3s;
    position: relative; z-index: var(--z-product);
    margin-top: 20px;
  }
  .cta-btn:hover {
    background: var(--light-gold); color: var(--mm-navy);
    border-color: var(--light-gold);
  }
  .cta-btn:focus-visible {
    outline: 2px solid var(--mm-navy);
    outline-offset: 4px;
  }

  /* Screen-reader only utility */
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* =============================================
     DESKTOP (768px+)
     ============================================= */
  @media (min-width: 768px) {
    .hamburger { display: none; }
    .header-mobile { display: none; }
    .back-link { display: block; left: 12px; }

    /* Desktop nav */
    .header-desktop {
      display: flex; align-items: center;
      position: fixed; top: 0; left: 0; right: 0; z-index: var(--z-fixed);
      padding: 28px 40px;
      background: rgba(240, 237, 223, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    @supports not (backdrop-filter: blur(1px)) {
      .header-desktop { background: rgba(240, 237, 223, 0.9); }
    }
    .header-desktop nav {
      flex: 1; display: flex; align-items: center;
      justify-content: center; gap: 40px;
    }
    .header-desktop nav a {
      font-family: var(--mm-sans); font-size: 1rem;
      font-weight: 400; color: var(--mm-navy); text-decoration: none;
      opacity: 0.9; transition: opacity 0.2s;
    }
    .header-desktop nav a:hover { opacity: 0.5; }
    .header-desktop .logo-desktop {
      width: 80px; height: auto; margin-left: auto; flex-shrink: 0;
    }

    .hero { gap: 0; padding-top: 96px; }

    /* Product stack */
    .product-stack {
      width: auto; max-width: none;
      height: 52vh; max-height: 520px;
    }
    .product-stack img {
      width: auto; height: 100%;
      filter: drop-shadow(0 16px 32px rgba(0,0,0,0.10))
              drop-shadow(0 6px 12px rgba(0,0,0,0.06));
    }

    /* Tagline */
    .tagline { font-size: 1.1rem; margin-top: 28px; }

    /* Category tabs */
    .category-tab {
      font-size: 0.9rem;
      padding: 8px 6px;
    }
    .cat-dot { margin: 0 16px; }

    /* Pills */
    .flavour-pills {
      justify-content: center;
      overflow: visible;
      padding: 4px 0;
      gap: 10px;
    }
    .flavour-pill {
      padding: 10px 24px;
      font-size: 0.85rem;
    }

    /* CTA */
    .cta-btn {
      padding: 14px 40px; font-size: 0.95rem; margin-top: 24px;
    }
  }

  @media (min-width: 1024px) {
    .header-desktop { padding: 32px 48px; }
    .header-desktop nav { gap: 52px; }
    .category-tab { font-size: 1rem; }
  }
</style>

<script>
(function() {
  // Menu: close on link click
  var toggle = document.getElementById('menu-toggle');
  var menu = document.querySelector('.mobile-menu');
  var hamburger = document.querySelector('.hamburger');
  document.querySelectorAll('.mobile-menu a').forEach(function(a) {
    a.addEventListener('click', function() {
      toggle.checked = false;
      toggle.dispatchEvent(new Event('change'));
    });
  });

  // Menu: close button
  var closeBtn = document.querySelector('.menu-close');
  if (closeBtn) {
    closeBtn.addEventListener('click', function() {
      toggle.checked = false;
      toggle.dispatchEvent(new Event('change'));
    });
  }

  // Menu: ARIA state sync + inert toggle
  toggle.addEventListener('change', function() {
    var isOpen = toggle.checked;
    menu.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
    hamburger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    if (isOpen) {
      menu.removeAttribute('inert');
    } else {
      menu.setAttribute('inert', '');
      hamburger.focus();
      return;
    }
    var focusable = menu.querySelectorAll('a, button, [tabindex]');
    if (!focusable.length) return;
    var first = focusable[0], last = focusable[focusable.length - 1];
    function trap(e) {
      if (e.key === 'Escape') { toggle.checked = false; toggle.dispatchEvent(new Event('change')); return; }
      if (e.key !== 'Tab') return;
      if (e.shiftKey) { if (document.activeElement === first) { e.preventDefault(); last.focus(); } }
      else { if (document.activeElement === last) { e.preventDefault(); first.focus(); } }
    }
    menu.addEventListener('keydown', trap);
    first.focus();
    var observer = new MutationObserver(function() {
      if (!toggle.checked) { menu.removeEventListener('keydown', trap); observer.disconnect(); }
    });
    observer.observe(toggle, { attributes: true });
  });

  // Product data (no gradient — background stays beige)
  var flavours = {
    original:      { tagline: 'Rich and smooth. Nothing added.',              cta: 'Shop Pure Carob',      url: '/shop/bars/pure-carob' },
    coconut:       { tagline: 'Toasted coconut, pure carob.',                 cta: 'Shop Golden Coconut',  url: '/shop/bars/golden-coconut' },
    mint:          { tagline: 'Clean, cool, naturally sweet.',                cta: 'Shop Peppermint',      url: '/shop/bars/peppermint' },
    hazelnut:      { tagline: 'Roasted hazelnuts through pure carob.',        cta: 'Shop Hazelnut',        url: '/shop/bars/hazelnut' },
    moon_hazelnut: { tagline: 'Carob crescents. One is never enough.',         cta: 'Shop Hazelnut Moon',   url: '/shop/moons/hazelnut' },
    bite_coconut:  { tagline: 'Poppable. Pure. A bag full of good.',          cta: 'Shop Coconut Bite',    url: '/shop/bites/coconut' },
    bite_gold:     { tagline: 'Smooth and golden. No reason needed.',         cta: 'Shop Gold Bite',       url: '/shop/bites/gold' },
    elixir_pure:   { tagline: 'Warm carob. Nothing extracted.',               cta: 'Shop Pure Elixir',     url: '/shop/elixirs/pure' },
    elixir_spiced: { tagline: 'Spiced carob. Something for the cold months.', cta: 'Shop Spiced Elixir',   url: '/shop/elixirs/spiced' }
  };

  // Default flavour per category
  var categoryDefaults = {
    bars: 'original',
    moons: 'moon_hazelnut',
    bites: 'bite_coconut',
    elixirs: 'elixir_pure'
  };

  var allPills = document.querySelectorAll('.flavour-pill');
  var allImages = document.querySelectorAll('.product-stack img');
  var taglineEl = document.getElementById('tagline');
  var ctaBtn = document.getElementById('cta-btn');
  var categoryTabs = document.querySelectorAll('.category-tab');

  function setFlavour(key) {
    var data = flavours[key];
    if (!data) return;

    // Update pills
    allPills.forEach(function(p) {
      var isActive = p.dataset.flavour === key;
      p.classList.toggle('active', isActive);
      p.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });

    // Crossfade product image
    allImages.forEach(function(img) {
      img.classList.toggle('active', img.dataset.flavour === key);
    });

    // Update tagline and CTA
    taglineEl.textContent = data.tagline;
    ctaBtn.textContent = data.cta;
    ctaBtn.href = data.url;
  }

  function setCategory(cat) {
    // Update category tab states
    categoryTabs.forEach(function(tab) {
      var isActive = tab.dataset.cat === cat;
      tab.classList.toggle('active', isActive);
      tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });

    // Show pills for selected category, hide others
    allPills.forEach(function(pill) {
      if (pill.dataset.category === cat) {
        pill.style.display = '';
      } else {
        pill.style.display = 'none';
        pill.classList.remove('active');
        pill.setAttribute('aria-selected', 'false');
      }
    });

    // Activate default flavour for this category
    setFlavour(categoryDefaults[cat]);
  }

  // Category tab clicks
  categoryTabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      setCategory(this.dataset.cat);
    });
  });

  // Flavour pill clicks
  allPills.forEach(function(pill) {
    pill.addEventListener('click', function() {
      setFlavour(this.dataset.flavour);
    });
  });

  // Keyboard nav for category tabs (left/right arrows)
  var tabsContainer = document.querySelector('.category-tabs');
  tabsContainer.addEventListener('keydown', function(e) {
    var tabs = Array.from(categoryTabs);
    var idx = tabs.indexOf(document.activeElement);
    if (idx === -1) return;
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      var next = (idx + 1) % tabs.length;
      tabs[next].focus(); tabs[next].click();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      var prev = (idx - 1 + tabs.length) % tabs.length;
      tabs[prev].focus(); tabs[prev].click();
    }
  });

  // Keyboard nav for flavour pills (left/right arrows, visible pills only)
  var pillContainer = document.querySelector('.flavour-pills');
  pillContainer.addEventListener('keydown', function(e) {
    var visible = Array.from(allPills).filter(function(p) { return p.style.display !== 'none'; });
    var idx = visible.indexOf(document.activeElement);
    if (idx === -1) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      var next = (idx + 1) % visible.length;
      visible[next].focus(); visible[next].click();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      var prev = (idx - 1 + visible.length) % visible.length;
      visible[prev].focus(); visible[prev].click();
    }
  });

  // Init: Bars category active
  setCategory('bars');
})();
</script>
</body>
</html>
