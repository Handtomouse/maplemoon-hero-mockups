<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo: Silhouettes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0b0b0b; font-family: -apple-system, sans-serif; }
  .hero { position: relative; width: 100%; height: 100vh; overflow: hidden; }
  .hero img { width: 100%; height: 100%; object-fit: cover; }
  .hero .overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 24px 40px; background: linear-gradient(transparent, rgba(0,0,0,0.7)); }
  .hero .overlay h2 { color: #E7E4CA; font-size: 14px; font-weight: 400; letter-spacing: 1px; text-transform: uppercase; }
  .hero .overlay p { color: #7B9DBF; font-size: 12px; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; }
  .grid .hero { height: 50vh; }
</style>
</head>
<body>
  <div class="hero">
    <img src="outputs/round_2/winners/maplemoon_minimalist_food_silhouette_photograph_gen_001_20260331_160157.png" alt="">
    <div class="overlay"><h2>R1 Silhouette A</h2><p>Full-bleed hero background candidate — wide carob tree silhouette on cornflower blue</p></div>
  </div>
  <div class="hero">
    <img src="outputs/round_2/winners/maplemoon_minimalist_food_silhouette_photograph_gen_002_20260331_160200.png" alt="">
    <div class="overlay"><h2>R1 Silhouette B</h2><p>Alternate composition</p></div>
  </div>
  <div class="hero">
    <img src="outputs/round_2/winners/maplemoon_minimalist_botanical_silhouette_photograph_gen_002_20260331_190407.png" alt="">
    <div class="overlay"><h2>R3 Wide Clean B</h2><p>No fruit on ground — clean horizon</p></div>
  </div>
  <div class="grid">
    <div class="hero">
      <img src="outputs/round_2/winners/maplemoon_minimalist_botanical_closeup_silhouette_gen_001_20260331_163816.png" alt="">
      <div class="overlay"><h2>R2 Close Crop A</h2><p>Tight pod cluster detail</p></div>
    </div>
    <div class="hero">
      <img src="outputs/round_2/winners/maplemoon_minimalist_botanical_closeup_silhouette_gen_002_20260331_163820.png" alt="">
      <div class="overlay"><h2>R2 Close Crop B</h2><p>Alternate crop</p></div>
    </div>
  </div>
</body>
</html>
