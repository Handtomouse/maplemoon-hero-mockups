<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>W1-E asset-preview QA</title>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, sans-serif; background: #e7e4ca; color: #1d1815; }
    body { margin: 0; }
    header { padding: 32px clamp(20px, 6vw, 96px); background: #244b61; color: #f7f3e2; }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 4vw, 48px); }
    p { margin: 0; line-height: 1.5; }
    section { padding: clamp(20px, 5vw, 80px); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 22px; }
    figure { margin: 0; min-width: 0; padding: 18px; background: #fff; border-radius: 24px; box-shadow: 0 8px 28px rgb(29 24 21 / 10%); }
    img { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: contain; background: #fff; }
    figcaption { margin-top: 12px; overflow-wrap: anywhere; font-size: 14px; font-weight: 650; }
  </style>
</head>
<body>
  <header>
    <h1>W1-E — unwired product-asset preview</h1>
    <p>QA surface only. It does not load or modify a MapleMoon page.</p>
  </header>
  <section aria-label="Prepared W1-E product assets">
    <div class="grid">
      <figure><img src="bananas.webp" alt="Prepared bananas product photograph"><figcaption>bananas</figcaption></figure>
      <figure><img src="moon_almond.webp" alt="Prepared almond Moon product photograph"><figcaption>moon_almond</figcaption></figure>
      <figure><img src="moon_cayenne.webp" alt="Prepared cayenne Moon product photograph"><figcaption>moon_cayenne</figcaption></figure>
      <figure><img src="moon_goji_coconut.webp" alt="Prepared coconut and goji Moon product photograph"><figcaption>moon_goji_coconut</figcaption></figure>
      <figure><img src="moon_hazelnut.webp" alt="Prepared hazelnut Moon product photograph"><figcaption>moon_hazelnut</figcaption></figure>
      <figure><img src="moon_peppermint.webp" alt="Prepared peppermint Moon product photograph"><figcaption>moon_peppermint</figcaption></figure>
      <figure><img src="moon_pure_carob.webp" alt="Prepared pure carob Moon product photograph"><figcaption>moon_pure_carob</figcaption></figure>
      <figure><img src="eclipse_almond.webp" alt="Prepared almond Eclipse Bite product photograph"><figcaption>eclipse_almond</figcaption></figure>
      <figure><img src="eclipse_fudge.webp" alt="Prepared salted caramel fudge Eclipse Bite product photograph"><figcaption>eclipse_fudge</figcaption></figure>
      <figure><img src="eclipse_hazelnut.webp" alt="Prepared hazelnut Eclipse Bite product photograph"><figcaption>eclipse_hazelnut</figcaption></figure>
      <figure><img src="eclipse_pecan.webp" alt="Prepared pecan Eclipse Bite product photograph"><figcaption>eclipse_pecan</figcaption></figure>
    </div>
  </section>
</body>
</html>
