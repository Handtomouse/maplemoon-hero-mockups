<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maple Moon: Living Moon concept</title>
<link rel="stylesheet" href="brand_kit.css">
<style>
/* LIVING MOON - concept mockup (hero only). Moon tracks tonight's real phase; palette shifts day/night. */
@font-face{font-family:'Mackinac';src:local('FONTSPRING DEMO - P22 Mackinac Pro Book'),local('FONTSPRINGDEMO-P22MackinacProBookRegular'),local('P22 Mackinac Pro');font-weight:400;font-display:swap;}
@font-face{font-family:'Mackinac';src:local('FONTSPRING DEMO - P22 Mackinac Pro Medium'),local('FONTSPRINGDEMO-P22MackinacProMediumRegular');font-weight:500;font-display:swap;}
.wf{
  --mm-serif:'Mackinac','P22 Mackinac Pro',Georgia,serif;
  /* DAY palette (default) */
  --ink:#2c2a26;--ink-soft:#6f6a62;--ink-faint:#a39d92;
  --paper:#f4f2ed;--paper2:#eceae4;--line:rgba(44,42,38,.14);--line-soft:rgba(44,42,38,.08);
  --wave:#2c2a26;--moonGlow:0 0 0 rgba(0,0,0,0);
  background:var(--paper);color:var(--ink);
  font-family:var(--mm-sans,'Neue Haas Grotesk Display Pro',Helvetica,sans-serif);font-weight:400;line-height:1.5;
  -webkit-font-smoothing:antialiased;transition:background .8s ease,color .8s ease;
}
.wf.night{
  /* NIGHT palette */
  --ink:#ece9e3;--ink-soft:#b4afa4;--ink-faint:#7d786d;
  --paper:#16181f;--paper2:#1e212a;--line:rgba(236,233,227,.16);--line-soft:rgba(236,233,227,.09);
  --wave:#ece9e3;--moonGlow:0 0 48px 6px rgba(231,227,213,.45);
}
.wf *,.wf *::before,.wf *::after{box-sizing:border-box;}
.wf a{color:inherit;text-decoration:none;}
.wf .wrap{max-width:1180px;margin:0 auto;padding:0 28px;}

.wf-hd{position:relative;z-index:5;border-bottom:1px solid var(--line-soft);transition:border-color .8s ease;}
.wf-hd .bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:62px;}
.wf-nav{display:flex;gap:28px;}.wf-nav.r{justify-content:flex-end;align-items:center;gap:22px;}
.wf-nav a{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;}
.wf-logo{font-family:var(--mm-serif);font-size:1.3rem;text-align:center;}

.wf-hero{position:relative;text-align:center;padding:52px 0 90px;overflow:hidden;min-height:80vh;display:flex;flex-direction:column;justify-content:center;}
.wf-waves{position:absolute;left:0;right:0;bottom:0;width:100%;height:54%;z-index:0;opacity:.45;}
.wf-waves path{stroke:var(--wave);transition:stroke .8s ease;}
.wf-hero .inner{position:relative;z-index:2;}
.wf-moon{width:120px;height:120px;margin:0 auto 2px;filter:drop-shadow(var(--moonGlow));transition:filter .8s ease;}
.wf-wm{font-family:var(--mm-serif);font-weight:400;font-size:clamp(4rem,15vw,11rem);line-height:.86;letter-spacing:.07em;margin:0;padding-left:.07em;color:var(--ink);transition:color .8s ease;}
.wf-tag{font-family:var(--mm-serif);font-size:clamp(1.05rem,2.2vw,1.5rem);color:var(--ink);margin:8px 0 14px;}
.wf-phaselabel{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:24px;}
.wf-pill{display:inline-flex;align-items:center;gap:9px;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:14px 30px;border:1px solid var(--ink);border-radius:50px;background:transparent;color:var(--ink);cursor:pointer;transition:all .28s,border-color .8s ease,color .8s ease;}
.wf-pill:hover{background:var(--ink);color:var(--paper);}

/* concept preview panel */
.cp{position:fixed;right:18px;bottom:18px;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border:1px solid rgba(44,42,38,.16);border-radius:14px;padding:14px 16px;width:248px;font-family:var(--mm-sans,sans-serif);color:#2c2a26;box-shadow:0 12px 30px rgba(0,0,0,.14);}
.cp h4{margin:0 0 2px;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;}
.cp .sub{font-size:.66rem;color:#6f6a62;margin:0 0 12px;line-height:1.35;}
.cp .seg{display:flex;gap:6px;margin-bottom:12px;}
.cp .seg button{flex:1;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;padding:8px 0;border:1px solid rgba(44,42,38,.2);border-radius:8px;background:transparent;color:#2c2a26;cursor:pointer;}
.cp .seg button.on{background:#2c2a26;color:#f4f2ed;border-color:#2c2a26;}
.cp label{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:#6f6a62;display:block;margin-bottom:6px;}
.cp input[type=range]{width:100%;accent-color:#2c2a26;}
.cp .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;}
.cp .reset{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #2c2a26;cursor:pointer;padding-bottom:1px;}
.cp .now{font-size:.62rem;color:#6f6a62;}

@media (prefers-reduced-motion:reduce){.wf,.wf *{transition:none!important;}}
</style>
</head>
<body>
<div class="wf" id="wf">

  <header class="wf-hd"><div class="wrap bar">
    <nav class="wf-nav"><a href="#">Shop</a><a href="#">Our Story</a><a href="#">Rituals</a><a href="#">Journal</a></nav>
    <a class="wf-logo" href="#">maple moon</a>
    <nav class="wf-nav r"><a href="#">Stockists</a><a href="#">EUR &euro;</a></nav>
  </div></header>

  <section class="wf-hero">
    <svg class="wf-waves" viewBox="0 0 1400 360" preserveAspectRatio="none" aria-hidden="true">
      <g fill="none" stroke-width="0.9" stroke-linecap="round">
        <path d="M40 70 q 22 -10 44 0 M120 64 q 22 -10 44 0 M210 72 q 22 -10 44 0 M320 66 q 22 -10 44 0 M430 72 q 22 -10 44 0 M540 66 q 22 -9 44 0 M650 72 q 22 -10 44 0 M780 66 q 22 -10 44 0 M900 72 q 22 -10 44 0 M1020 66 q 22 -10 44 0 M1140 72 q 22 -10 44 0 M1260 66 q 22 -10 44 0"/>
        <path d="M0 156 q 34 -14 68 0 M120 148 q 34 -14 68 0 M260 158 q 34 -14 68 0 M420 150 q 34 -14 68 0 M580 158 q 34 -14 68 0 M760 150 q 34 -14 68 0 M940 158 q 34 -14 68 0 M1120 150 q 34 -14 68 0 M1300 158 q 34 -14 68 0"/>
        <path d="M0 240 q 52 -22 104 0 M180 228 q 52 -22 104 0 M400 242 q 52 -22 104 0 M640 230 q 52 -22 104 0 M900 242 q 52 -22 104 0 M1180 230 q 52 -22 104 0"/>
        <path d="M0 320 q 64 -26 128 0 M240 306 q 64 -26 128 0 M520 322 q 64 -26 128 0 M820 308 q 64 -26 128 0 M1140 322 q 64 -24 128 0"/>
      </g>
    </svg>
    <div class="inner wrap">
      <div class="wf-moon">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <radialGradient id="lit" cx="42%" cy="38%" r="68%"><stop offset="0%" stop-color="#fdfdfb"/><stop offset="55%" stop-color="#e7e3d9"/><stop offset="100%" stop-color="#cdc8bb"/></radialGradient>
            <mask id="phase">
              <circle cx="50" cy="50" r="48" fill="#fff"/>
              <rect id="mHalf" x="2" y="2" width="48" height="96" fill="#000"/>
              <ellipse id="mTerm" cx="50" cy="50" rx="0" ry="48" fill="#000"/>
            </mask>
          </defs>
          <!-- faint dark side of the moon -->
          <circle cx="50" cy="50" r="48" fill="#9a9488" opacity="0.18"/>
          <!-- lit portion, clipped to current phase -->
          <g mask="url(#phase)">
            <circle cx="50" cy="50" r="48" fill="url(#lit)"/>
            <g fill="#c4bfb0" opacity=".5"><circle cx="38" cy="40" r="8"/><circle cx="64" cy="58" r="6"/><circle cx="56" cy="34" r="3.5"/><circle cx="45" cy="66" r="5"/><circle cx="70" cy="46" r="2.6"/><circle cx="35" cy="58" r="3"/></g>
          </g>
        </svg>
      </div>
      <h1 class="wf-wm">CAROB</h1>
      <p class="wf-tag">Naturally Sweet, Nothing Added.</p>
      <p class="wf-phaselabel" id="phaseLabel">Tonight&rsquo;s moon</p>
      <div><a class="wf-pill" href="#">Explore Our Bars</a></div>
    </div>
  </section>

  <!-- CONCEPT PREVIEW PANEL (mockup only - not part of the real page) -->
  <div class="cp" aria-label="Concept preview controls">
    <h4>Living Moon &middot; concept</h4>
    <p class="sub">The hero moon shows tonight&rsquo;s real phase; the palette shifts day to night. Preview any state:</p>
    <label>Theme</label>
    <div class="seg" id="segTheme"><button data-t="day" class="on">Day</button><button data-t="night">Night</button><button data-t="auto">Auto</button></div>
    <label>Moon phase</label>
    <input type="range" id="phaseRange" min="0" max="1" step="0.01" value="0.5">
    <div class="row"><span class="now" id="phaseNow">First quarter</span><span class="reset" id="reset">Tonight</span></div>
  </div>

</div>

<script>
(function(){
  var wf=document.getElementById('wf');
  var mHalf=document.getElementById('mHalf'), mTerm=document.getElementById('mTerm');
  var label=document.getElementById('phaseLabel'), now=document.getElementById('phaseNow');
  var range=document.getElementById('phaseRange');

  function phaseName(p){ // p 0..1
    if(p<0.03||p>0.97)return 'New moon';
    if(p<0.22)return 'Waxing crescent';
    if(p<0.28)return 'First quarter';
    if(p<0.47)return 'Waxing gibbous';
    if(p<0.53)return 'Full moon';
    if(p<0.72)return 'Waning gibbous';
    if(p<0.78)return 'Last quarter';
    return 'Waning crescent';
  }
  function render(p){ // p 0..1 (0 new, .5 full)
    var illum=(1-Math.cos(2*Math.PI*p))/2;      // 0..1 lit fraction
    var waxing=p<0.5;
    // hide the un-lit half
    if(waxing){mHalf.setAttribute('x','2');}else{mHalf.setAttribute('x','50');}
    // terminator ellipse: rx = 48*|1-2*illum|, black subtracts (crescent), white adds (gibbous)
    var rx=48*Math.abs(1-2*illum);
    mTerm.setAttribute('rx',rx.toFixed(2));
    mTerm.setAttribute('fill', illum<0.5 ? '#000' : '#fff');
    now.textContent=phaseName(p);
  }
  function realPhase(){
    var synodic=29.530588853;
    var ref=Date.UTC(2000,0,6,18,14)/86400000;
    var n=Date.now()/86400000;
    var age=((n-ref)%synodic+synodic)%synodic;
    return age/synodic;
  }
  function applyTheme(mode){
    var night = mode==='night' || (mode==='auto' && (new Date().getHours()<7 || new Date().getHours()>=19));
    wf.classList.toggle('night', night);
  }
  // theme segmented control
  var seg=document.getElementById('segTheme');
  seg.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b)return;
    [].forEach.call(seg.children,function(c){c.classList.toggle('on',c===b);});
    applyTheme(b.getAttribute('data-t'));
  });
  // phase slider
  range.addEventListener('input',function(){var v=parseFloat(range.value);render(v);label.textContent='Preview · '+phaseName(v);});
  // reset to tonight
  document.getElementById('reset').addEventListener('click',function(){
    var p=realPhase(); range.value=p.toFixed(2); render(p);
    label.textContent="Tonight’s moon · "+phaseName(p);
  });
  // init: real phase + auto-ish day default
  var p0=realPhase(); range.value=p0.toFixed(2); render(p0);
  label.textContent="Tonight’s moon · "+phaseName(p0);
  applyTheme('day');
})();
</script>
</body>
</html>
