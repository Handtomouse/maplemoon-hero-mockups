<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MapleMoon — design tuning playground</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{display:flex;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f1216;color:#e8ecf0;}
  .panel{width:340px;flex:0 0 340px;background:#161b22;border-right:1px solid #2a313a;overflow-y:auto;padding:16px 16px 28px;}
  .panel h1{font-size:14px;margin:0 0 3px;font-weight:600;}
  .panel .sub{font-size:11px;line-height:1.5;color:#8b97a4;margin:0 0 16px;}
  .panel .sub code{color:#7fd1c0;}
  .grp{margin:0 0 16px;}
  .grp h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#8b97a4;margin:0 0 9px;border-bottom:1px solid #2a313a;padding-bottom:5px;}
  .ctl{margin:0 0 11px;}
  .ctl > label{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:4px;}
  .ctl .v{color:#7fd1c0;font-family:ui-monospace,SFMono-Regular,monospace;font-size:11.5px;}
  .ctl .v.changed{color:#ffd479;}
  input[type=range]{width:100%;accent-color:#7fd1c0;height:18px;}
  select{width:100%;background:#0f1216;color:#e8ecf0;border:1px solid #2a313a;border-radius:6px;padding:7px 8px;font:inherit;font-size:12px;}
  .presets{display:flex;flex-wrap:wrap;gap:6px;}
  .presets button{flex:1 1 60px;background:#0f1216;color:#cdd6df;border:1px solid #2a313a;border-radius:6px;padding:7px 4px;font-size:11px;cursor:pointer;transition:border-color .15s;}
  .presets button:hover{border-color:#7fd1c0;color:#fff;}
  .actions{display:flex;gap:8px;margin:14px 0 0;}
  .actions button{flex:1;border:0;border-radius:6px;padding:10px;font-size:12px;font-weight:600;cursor:pointer;}
  #copy{background:#7fd1c0;color:#0b1014;}
  #copy:hover{background:#93ddcd;}
  #reset{background:#2a313a;color:#e8ecf0;}
  #reset:hover{background:#37404b;}
  #applyfile{width:100%;background:#ffd479;color:#2a1f00;}
  #applyfile:hover{background:#ffdf95;}
  .out{margin-top:10px;background:#0b0e11;border:1px solid #2a313a;border-radius:6px;padding:9px 10px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:11px;line-height:1.55;color:#9fb0bf;white-space:pre-wrap;word-break:break-word;min-height:22px;}
  .stage{flex:1;position:relative;background:#dfe6ee;}
  .stage iframe{width:100%;height:100%;border:0;display:block;}
  .toast{position:fixed;left:356px;bottom:18px;background:#7fd1c0;color:#0b1014;padding:9px 16px;border-radius:6px;font-size:12px;font-weight:600;opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
<div class="panel">
  <h1>MapleMoon · tuning</h1>
  <p class="sub">Drag a control — the homepage updates live. <strong>Copy CSS</strong> gives you the changed <code>--vars</code> to paste into <code>.wf{ }</code> in homepage_real_1_lead.html.</p>

  <div class="grp">
    <h2>Presets</h2>
    <div class="presets" id="presets"></div>
  </div>

  <div class="grp" id="grp-spacing"><h2>Spacing</h2></div>
  <div class="grp" id="grp-type"><h2>Typography</h2></div>
  <div class="grp" id="grp-layout"><h2>Layout</h2></div>
  <div class="grp" id="grp-hero"><h2>Hero &amp; dissolve</h2></div>
  <div class="grp" id="grp-atmos"><h2>Atmosphere</h2></div>
  <div class="grp" id="grp-cf"><h2>Selector fan</h2></div>
  <div class="grp" id="grp-colour"><h2>Colour</h2></div>
  <div class="grp" id="grp-sky">
    <h2>Sky</h2>
    <div class="ctl">
      <label for="grade">Grade <span class="v" id="grade-v">cyan</span></label>
      <select id="grade">
        <option value="cyan">Cyan — brightest / daytime</option>
        <option value="cornflower">Cornflower — balanced</option>
        <option value="periwinkle">Periwinkle — cooler / violet</option>
        <option value="navy">Navy — deep twilight</option>
      </select>
    </div>
  </div>

  <div class="actions"><button id="applyfile">★ Apply to file (bake in)</button></div>
  <div class="actions">
    <button id="copy">Copy CSS</button>
    <button id="reset">Reset</button>
  </div>
  <div class="out" id="out">No changes yet — defaults shown.</div>
</div>

<div class="stage"><iframe id="frame" src="/homepage_real_1_lead.html" title="MapleMoon homepage live preview"></iframe></div>
<div class="toast" id="toast">Copied!</div>

<script>
(function(){
  var SLIDERS=[
    {grp:'spacing', key:'--rhythm',  label:'Rhythm — scales all gaps', min:0.6, max:1.4, step:0.05, def:1,   unit:''},
    {grp:'spacing', key:'--sp-xl',   label:'XL gap · ritual + testimonial', min:12, max:96, step:1, def:64, unit:'px'},
    {grp:'spacing', key:'--sp-lg',   label:'LG gap · carob + our story',     min:12, max:96, step:1, def:56, unit:'px'},
    {grp:'spacing', key:'--sp-md',   label:'MD gap · ready CTA',             min:12, max:96, step:1, def:44, unit:'px'},
    {grp:'spacing', key:'--sp-sm',   label:'SM gap · trust strip',           min:8,  max:72, step:1, def:30, unit:'px'},
    {grp:'spacing', key:'--sp-xs',   label:'XS gap · newsletter + footer',   min:8,  max:64, step:1, def:24, unit:'px'},
    {grp:'hero', key:'--hero-h',  label:'Hero height',   min:60,  max:100, step:1, def:84,  unit:'vh'},
    {grp:'hero', key:'--hb-end',  label:'Dissolve end (into flow)', min:120, max:360, step:2, def:270, unit:'px'},
    {grp:'hero', key:'--hb-hold', label:'Dissolve hold (fade start)', min:0, max:200, step:2, def:120, unit:'px'},
    {grp:'atmos', key:'--mist',  label:'Mist (cloud wisps)', min:0, max:1.8, step:0.05, def:1,   unit:''},
    {grp:'atmos', key:'--glow',  label:'Moon glow (centre column)', min:0, max:0.6, step:0.02, def:0.2, unit:''},
    {grp:'atmos', key:'--grain', label:'Film grain', min:0, max:0.25, step:0.01, def:0.09, unit:''},
    {grp:'type', key:'--wordmark-w', label:'CAROB width', min:36, max:88, step:1, def:60, unit:''},
    {grp:'type', key:'--h-scale', label:'Heading size', min:0.7, max:1.5, step:0.05, def:1, unit:''},
    {grp:'layout', key:'--wrap-w', label:'Content width', min:920, max:1320, step:10, def:1180, unit:'px'},
    {grp:'layout', key:'--pad-x', label:'Side padding', min:12, max:72, step:2, def:28, unit:'px'},
    {grp:'layout', key:'--radius', label:'Corner radius', min:0, max:2, step:0.05, def:1, unit:''},
    {grp:'hero', key:'--scrim', label:'Hero text scrim', min:0, max:1.6, step:0.05, def:1, unit:''},
    {grp:'cf', key:'--cf-spread', label:'Fan spread', min:80, max:220, step:2, def:138, unit:''},
    {grp:'cf', key:'--cf-tilt', label:'Fan tilt (rotate)', min:0, max:70, step:1, def:38, unit:''},
    {grp:'cf', key:'--cf-depth', label:'Fan depth', min:60, max:320, step:5, def:178, unit:''},
    {grp:'cf', key:'--bar-shadow', label:'Bar shadow', min:0, max:0.4, step:0.01, def:0.16, unit:''},
    {grp:'cf', key:'--cf-speed', label:'Fan transition (s)', min:0.1, max:1.2, step:0.05, def:0.55, unit:''},
    {grp:'atmos', key:'--pool', label:'Light pool', min:0, max:1, step:0.05, def:0.85, unit:''}
  ];
  var COLORS=[
    {key:'--flow-top',  label:'Flow top (dissolve)', def:'#b6ccde'},
    {key:'--flow-pale', label:'Flow bottom (pale)',  def:'#eef2f5'},
    {key:'--ink',       label:'Text colour',          def:'#2c2a26'}
  ];
  var GRADES={
    cyan:['linear-gradient(180deg, rgba(72,150,198,.40) 0%, rgba(124,186,216,.30) 55%, rgba(170,208,226,.22) 100%)','saturate(1.4) brightness(1.12) contrast(1.0)'],
    cornflower:['linear-gradient(180deg, rgba(64,116,182,.40) 0%, rgba(108,152,202,.30) 55%, rgba(150,182,212,.22) 100%)','saturate(1.5) brightness(1.04) contrast(1.04)'],
    periwinkle:['linear-gradient(180deg, rgba(100,110,200,.40) 0%, rgba(136,146,216,.30) 55%, rgba(172,180,226,.22) 100%)','saturate(1.48) brightness(1.06) contrast(1.03)'],
    navy:['linear-gradient(180deg, rgba(34,70,130,.48) 0%, rgba(58,98,158,.34) 55%, rgba(94,132,182,.24) 100%)','saturate(1.55) brightness(.97) contrast(1.09)']
  };
  var DEF={grade:'cyan'};
  SLIDERS.forEach(function(s){DEF[s.key]=s.def;});
  COLORS.forEach(function(c){DEF[c.key]=c.def;});
  var state=JSON.parse(JSON.stringify(DEF));

  var PRESETS={
    'Default':  {},
    'Tight':    {'--rhythm':0.82},
    'Roomy':    {'--rhythm':1.18},
    'Daytime':  {grade:'cyan','--hero-h':88},
    'Navy dusk':{grade:'navy'},
    'Compact hero':{'--hero-h':72,'--hb-end':210,'--hb-hold':80}
  };

  var frame=document.getElementById('frame'), out=document.getElementById('out'), toast=document.getElementById('toast');

  function wf(){try{return frame.contentWindow.document.querySelector('.wf');}catch(e){return null;}}

  // build sliders
  SLIDERS.forEach(function(s){
    var box=document.createElement('div'); box.className='ctl';
    box.innerHTML='<label for="'+s.key+'">'+s.label+' <span class="v" id="v'+s.key+'"></span></label>'+
      '<input type="range" id="'+s.key+'" min="'+s.min+'" max="'+s.max+'" step="'+s.step+'" value="'+s.def+'">';
    document.getElementById('grp-'+s.grp).appendChild(box);
    var inp=box.querySelector('input');
    inp.addEventListener('input', function(){ state[s.key]=parseFloat(inp.value); apply(); });
  });
  var gradeSel=document.getElementById('grade');
  gradeSel.addEventListener('change', function(){ state.grade=gradeSel.value; apply(); });
  COLORS.forEach(function(c){
    var box=document.createElement('div'); box.className='ctl';
    box.innerHTML='<label for="'+c.key+'">'+c.label+' <span class="v" id="v'+c.key+'"></span></label>'+
      '<input type="color" id="'+c.key+'" value="'+c.def+'" style="width:100%;height:30px;background:#0f1216;border:1px solid #2a313a;border-radius:6px;padding:2px;cursor:pointer;">';
    document.getElementById('grp-colour').appendChild(box);
    box.querySelector('input').addEventListener('input', function(){ state[c.key]=this.value; apply(); });
  });

  // presets
  var pwrap=document.getElementById('presets');
  Object.keys(PRESETS).forEach(function(name){
    var b=document.createElement('button'); b.textContent=name;
    b.addEventListener('click', function(){
      state=JSON.parse(JSON.stringify(DEF));
      var p=PRESETS[name]; Object.keys(p).forEach(function(k){ state[k]=p[k]; });
      syncControls(); apply();
    });
    pwrap.appendChild(b);
  });

  function syncControls(){
    SLIDERS.forEach(function(s){
      var inp=document.getElementById(s.key); inp.value=state[s.key];
    });
    gradeSel.value=state.grade;
    COLORS.forEach(function(c){ var inp=document.getElementById(c.key); if(inp) inp.value=state[c.key]; });
  }

  function fmt(s){ return s.key==='--rhythm' ? (Math.round(state[s.key]*100)/100) : (state[s.key]+s.unit); }

  function apply(){
    var el=wf();
    if(el){
      // rhythm + grade always applied; other tokens only when changed (so rhythm keeps scaling untouched gaps)
      el.style.setProperty('--rhythm', state['--rhythm']);
      var g=GRADES[state.grade]; el.style.setProperty('--sky-grad', g[0]); el.style.setProperty('--sky-filter', g[1]);
      SLIDERS.forEach(function(s){
        if(s.key==='--rhythm') return;
        if(state[s.key]!==DEF[s.key]) el.style.setProperty(s.key, state[s.key]+s.unit);
        else el.style.removeProperty(s.key);
      });
      COLORS.forEach(function(c){
        if(state[c.key]!==DEF[c.key]) el.style.setProperty(c.key, state[c.key]);
        else el.style.removeProperty(c.key);
      });
    }
    // readouts
    SLIDERS.forEach(function(s){
      var v=document.getElementById('v'+s.key); v.textContent=fmt(s);
      v.className='v'+(state[s.key]!==DEF[s.key]?' changed':'');
    });
    COLORS.forEach(function(c){
      var v=document.getElementById('v'+c.key); if(v){ v.textContent=state[c.key]; v.className='v'+(state[c.key]!==DEF[c.key]?' changed':''); }
    });
    var gv=document.getElementById('grade-v'); gv.textContent=state.grade; gv.className='v'+(state.grade!==DEF.grade?' changed':'');
    renderOut();
  }

  function renderOut(){
    var lines=[];
    if(state['--rhythm']!==DEF['--rhythm']) lines.push('--rhythm:'+(Math.round(state['--rhythm']*100)/100)+';');
    SLIDERS.forEach(function(s){ if(s.key!=='--rhythm' && state[s.key]!==DEF[s.key]) lines.push(s.key+':'+state[s.key]+s.unit+';'); });
    if(state.grade!==DEF.grade){ var g=GRADES[state.grade]; lines.push('--sky-grad:'+g[0]+';'); lines.push('--sky-filter:'+g[1]+';'); }
    COLORS.forEach(function(c){ if(state[c.key]!==DEF[c.key]) lines.push(c.key+':'+state[c.key]+';'); });
    out.textContent = lines.length ? lines.join('\n') : 'No changes — defaults shown.';
    return lines;
  }

  document.getElementById('copy').addEventListener('click', function(){
    var txt=renderOut().join('\n'); if(!txt || txt.indexOf('No changes')===0) txt='/* no changes from defaults */';
    navigator.clipboard.writeText(txt).then(function(){ toast.classList.add('show'); setTimeout(function(){toast.classList.remove('show');},1100); });
  });
  function changedVars(){
    var o={};
    if(state['--rhythm']!==DEF['--rhythm']) o['--rhythm']=''+(Math.round(state['--rhythm']*100)/100);
    SLIDERS.forEach(function(s){ if(s.key!=='--rhythm' && state[s.key]!==DEF[s.key]) o[s.key]=state[s.key]+s.unit; });
    if(state.grade!==DEF.grade){ var g=GRADES[state.grade]; o['--sky-grad']=g[0]; o['--sky-filter']=g[1]; }
    COLORS.forEach(function(c){ if(state[c.key]!==DEF[c.key]) o[c.key]=state[c.key]; });
    return o;
  }
  function flash(msg,bg){ toast.textContent=msg; toast.style.background=bg||'#7fd1c0'; toast.classList.add('show'); setTimeout(function(){toast.classList.remove('show');},1500); }

  document.getElementById('applyfile').addEventListener('click', function(){
    var vars=changedVars();
    if(!Object.keys(vars).length){ flash('Nothing changed to bake','#ffd479'); return; }
    var btn=this; btn.disabled=true; btn.textContent='Baking…';
    fetch('/_apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({vars:vars})})
      .then(function(r){return r.json();})
      .then(function(res){
        btn.disabled=false; btn.textContent='★ Apply to file (bake in)';
        if(res.ok){ flash('Baked '+res.applied.length+' var(s) into the file'); DEF=JSON.parse(JSON.stringify(state)); frame.src=frame.src.split('?')[0]+'?_t='+Date.now(); }
        else flash('Apply failed: '+(res.error||'?'),'#ff8c8c');
      })
      .catch(function(e){ btn.disabled=false; btn.textContent='★ Apply to file (bake in)'; flash('Apply failed: '+e,'#ff8c8c'); });
  });

  document.getElementById('reset').addEventListener('click', function(){
    state=JSON.parse(JSON.stringify(DEF)); syncControls(); frame.src=frame.src.split('?')[0]; // reload clean
  });

  // re-apply current state whenever the iframe (re)loads
  frame.addEventListener('load', function(){ syncControls(); apply(); });
  // first paint of readouts
  apply();
})();
</script>
</body>
</html>
