<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapleMoon — Mockup Maker | HandToMouse Studio</title>
  <meta name="description" content="Build a branded product hero image for MapleMoon. Pick a product, set a background, add text and icons — export as PNG.">
  <meta name="theme-color" content="#1E4366">
  <link rel="icon" href="assets/maplemoon_logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/maplemoon_logo.svg">
  <link rel="stylesheet" href="brand_kit.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-font-smoothing: antialiased; }

    body {
      font-family: var(--mm-sans);
      background: #F0EEE8;
      color: var(--mm-navy);
      min-height: 100vh;
    }

    /* ── Header ── */
    .mm-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 32px;
      height: 56px;
      background: #fff;
      border-bottom: 1px solid rgba(30,67,102,0.1);
      position: sticky;
      top: 0;
      z-index: var(--z-sticky);
    }

    .mm-back {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--mm-navy);
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .mm-back:hover { opacity: 1; }
    .mm-back svg { flex-shrink: 0; }

    .mm-header__logo {
      height: 24px;
      width: auto;
    }

    .mm-header__title {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--mm-navy);
      opacity: 0.5;
      margin-left: auto;
    }

    /* ── Tool Layout ── */
    .mm-tool {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: calc(100vh - 56px);
    }

    /* ── Controls Panel ── */
    .mm-controls {
      background: #fff;
      border-right: 1px solid rgba(30,67,102,0.08);
      overflow-y: auto;
      padding: 24px 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .mm-section__label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mm-navy);
      opacity: 0.4;
      margin-bottom: 12px;
    }

    /* Product grid */
    .mm-product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .mm-group-label {
      grid-column: 1 / -1;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mm-navy);
      opacity: 0.3;
      margin-top: 8px;
      margin-bottom: 2px;
    }
    .mm-group-label:first-child { margin-top: 0; }

    .mm-product-tile {
      background: none;
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 4px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
    }
    .mm-product-tile:hover { border-color: rgba(30,67,102,0.2); transform: scale(1.03); }
    .mm-product-tile--active { border-color: var(--mm-navy); }
    .mm-product-tile:focus-visible { outline: 2px solid var(--mm-navy); outline-offset: 2px; }

    .mm-product-tile img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 5px;
      display: block;
    }

    .mm-product-tile span {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--mm-navy);
      opacity: 0.7;
      line-height: 1.2;
    }

    /* Background swatches */
    .mm-swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .mm-swatch {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      outline-offset: 3px;
      position: relative;
    }
    .mm-swatch:hover { transform: scale(1.12); }
    .mm-swatch--active {
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--mm-navy);
    }
    .mm-swatch:focus-visible { outline: 2px solid var(--mm-navy); }

    /* Text fields */
    .mm-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }
    .mm-field:last-child { margin-bottom: 0; }

    .mm-field__label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mm-navy);
      opacity: 0.5;
    }

    .mm-field__input {
      font-family: var(--mm-sans);
      font-size: 13px;
      color: var(--mm-navy);
      background: #F8F7F4;
      border: 1px solid rgba(30,67,102,0.15);
      border-radius: 6px;
      padding: 8px 10px;
      width: 100%;
      transition: border-color 0.15s;
    }
    .mm-field__input:focus {
      outline: none;
      border-color: var(--mm-navy);
    }

    /* Toggle group */
    .mm-toggle-group {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .mm-toggle-btn {
      font-family: var(--mm-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--mm-navy);
      background: #F8F7F4;
      border: 1px solid rgba(30,67,102,0.15);
      border-radius: 20px;
      padding: 5px 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .mm-toggle-btn:hover { border-color: var(--mm-navy); }
    .mm-toggle-btn--active {
      background: var(--mm-navy);
      color: var(--mm-cream);
      border-color: var(--mm-navy);
    }
    .mm-toggle-btn:focus-visible { outline: 2px solid var(--mm-navy); outline-offset: 2px; }

    /* Icon chips */
    .mm-icon-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mm-icon-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mm-sans);
      font-size: 11px;
      font-weight: 500;
      color: var(--mm-navy);
      background: #F8F7F4;
      border: 1px solid rgba(30,67,102,0.15);
      border-radius: 20px;
      padding: 5px 10px 5px 7px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .mm-icon-chip img { width: 14px; height: 14px; opacity: 0.6; }
    .mm-icon-chip:hover { border-color: var(--mm-navy); }
    .mm-icon-chip--active {
      background: var(--mm-navy);
      color: var(--mm-cream);
      border-color: var(--mm-navy);
    }
    .mm-icon-chip--active img { filter: brightness(10); opacity: 0.9; }
    .mm-icon-chip:focus-visible { outline: 2px solid var(--mm-navy); outline-offset: 2px; }

    /* Export button */
    .mm-export-btn {
      font-family: var(--mm-sans);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--mm-cream);
      background: var(--mm-navy);
      border: none;
      border-radius: 8px;
      padding: 14px 20px;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      margin-top: 4px;
    }
    .mm-export-btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .mm-export-btn:active { transform: translateY(0); }
    .mm-export-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .mm-export-btn:focus-visible { outline: 2px solid var(--mm-navy); outline-offset: 3px; }

    /* ── Preview Panel ── */
    .mm-preview-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      gap: 16px;
      overflow: hidden;
      height: calc(100vh - 56px);
    }

    .mm-preview-shell {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2), 0 4px 16px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }

    /* ── The exportable canvas ── */
    #mm-canvas {
      position: relative;
      overflow: hidden;
      transform-origin: top left;
      /* width, height, transform set by JS */
    }

    .mm-canvas__watermark {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      overflow: hidden;
    }
    .mm-canvas__watermark img {
      width: 90%;
      max-width: 900px;
      opacity: 0.04;
      user-select: none;
    }

    .mm-canvas__product-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8%;
    }

    .mm-canvas__product-img {
      max-height: 80%;
      max-width: 50%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 24px 40px rgba(0,0,0,0.3));
    }

    .mm-canvas__text {
      position: absolute;
      left: 8%;
      bottom: 18%;
      max-width: 46%;
    }

    .mm-canvas__headline {
      font-family: 'P22 Mackinac Pro', Georgia, serif;
      font-size: 56px;
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -0.01em;
      margin-bottom: 12px;
      word-break: break-word;
    }

    .mm-canvas__subhead {
      font-family: 'Neue Haas Grotesk Display Pro', 'Inter', Helvetica, sans-serif;
      font-size: 16px;
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.75;
    }

    .mm-canvas__icons {
      position: absolute;
      left: 8%;
      top: 10%;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .mm-canvas__icon {
      width: 48px;
      height: 48px;
      object-fit: contain;
      display: block;
    }

    .mm-canvas__logo {
      position: absolute;
      top: 10%;
      right: 8%;
    }
    .mm-canvas__logo img {
      height: 36px;
      width: auto;
    }

    /* Preview label */
    .mm-preview-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--mm-navy);
      opacity: 0.4;
    }

    /* ── Responsive ── */
    @media (max-width: 860px) {
      .mm-tool {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }
      .mm-controls {
        border-right: none;
        border-bottom: 1px solid rgba(30,67,102,0.08);
        max-height: 50vh;
      }
      .mm-preview-wrap {
        padding: 24px;
        min-height: 50vh;
      }
    }
  </style>
</head>
<body>

  <a href="#main" class="skip-link">Skip to content</a>

  <header class="mm-header">
    <a href="index.html" class="mm-back" aria-label="Back to gallery">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Gallery
    </a>
    <img src="assets/maplemoon_logo.svg" alt="MapleMoon" class="mm-header__logo">
    <span class="mm-header__title">Mockup Maker</span>
  </header>

  <main class="mm-tool" id="main">

    <!-- LEFT: CONTROLS -->
    <aside class="mm-controls" aria-label="Mockup controls">

      <div>
        <p class="mm-section__label">Product</p>
        <div class="mm-product-grid" id="product-grid" role="radiogroup" aria-label="Select a product"></div>
      </div>

      <div>
        <p class="mm-section__label">Background</p>
        <div class="mm-swatches" id="swatch-grid" role="radiogroup" aria-label="Background colour"></div>
      </div>

      <div>
        <p class="mm-section__label">Text</p>
        <div class="mm-field">
          <label for="input-headline" class="mm-field__label">Headline</label>
          <input type="text" id="input-headline" class="mm-field__input"
                 maxlength="60" placeholder="Pure Carob. No Compromise."
                 value="Pure Carob. No Compromise.">
        </div>
        <div class="mm-field">
          <label for="input-subhead" class="mm-field__label">Subhead</label>
          <input type="text" id="input-subhead" class="mm-field__input"
                 maxlength="100" placeholder="Organic · Vegan · Byron Bay"
                 value="Organic · Vegan · Handmade in Byron Bay">
        </div>
        <div class="mm-field">
          <p class="mm-field__label">Text colour</p>
          <div class="mm-toggle-group" id="text-color-group" role="radiogroup" aria-label="Text colour">
            <button class="mm-toggle-btn mm-toggle-btn--active" data-text-color="cream" aria-pressed="true">Cream</button>
            <button class="mm-toggle-btn" data-text-color="navy" aria-pressed="false">Navy</button>
          </div>
        </div>
      </div>

      <div>
        <p class="mm-section__label">Certification Icons</p>
        <div class="mm-icon-chips" id="icon-chips" role="group" aria-label="Toggle certification icons"></div>
      </div>

      <div>
        <p class="mm-section__label">Format</p>
        <div class="mm-toggle-group" id="format-group" role="radiogroup" aria-label="Export format">
          <button class="mm-toggle-btn mm-toggle-btn--active" data-format="og" aria-pressed="true">OG 1200×628</button>
          <button class="mm-toggle-btn" data-format="square" aria-pressed="false">Square 1080×1080</button>
          <button class="mm-toggle-btn" data-format="story" aria-pressed="false">Story 1080×1920</button>
        </div>
      </div>

      <button class="mm-export-btn" id="btn-export" type="button">Export PNG</button>

    </aside>

    <!-- RIGHT: PREVIEW -->
    <section class="mm-preview-wrap" aria-label="Live preview">
      <div class="mm-preview-shell" id="preview-shell">
        <div id="mm-canvas">

          <div class="mm-canvas__watermark" aria-hidden="true">
            <img src="assets/carob_wordmark.svg" alt="">
          </div>

          <div class="mm-canvas__product-wrap">
            <img src="assets/product_shots/bar_pure_carob.png" alt="Original Bar" id="canvas-product-img" class="mm-canvas__product-img">
          </div>

          <div class="mm-canvas__text" id="canvas-text">
            <p class="mm-canvas__headline" id="canvas-headline">Pure Carob. No Compromise.</p>
            <p class="mm-canvas__subhead" id="canvas-subhead">Organic · Vegan · Handmade in Byron Bay</p>
          </div>

          <div class="mm-canvas__icons" id="canvas-icons"></div>

          <div class="mm-canvas__logo">
            <img src="assets/maplemoon_logo.svg" alt="MapleMoon" id="canvas-logo-img">
          </div>

        </div>
      </div>
      <p class="mm-preview-label" id="preview-label">1200 × 628 — Open Graph</p>
    </section>

  </main>

  <script>
    /* ══════════════════════════════════════════
       MapleMoon Mockup Maker
       ══════════════════════════════════════════ */

    /* ── Data ── */

    var PRODUCTS = [
      // Bars
      { key: 'bar_original',     label: 'Original',     src: 'assets/product_shots/bar_pure_carob.png',     group: 'Bars' },
      { key: 'bar_almond',       label: 'Almond',       src: 'assets/product_shots/bar_almond.png',       group: 'Bars' },
      { key: 'bar_chilli',       label: 'Chilli',       src: 'assets/product_shots/bar_cayenne.png',       group: 'Bars' },
      { key: 'bar_hazelnut',     label: 'Hazelnut',     src: 'assets/product_shots/bar_hazelnut.png',     group: 'Bars' },
      { key: 'bar_peppermint',   label: 'Peppermint',   src: 'assets/product_shots/bar_peppermint.png',   group: 'Bars' },
      { key: 'bar_coconut_goji', label: 'Coconut Goji', src: 'assets/product_shots/bar_goji_coconut.png', group: 'Bars' },
      { key: 'bar_bundle',       label: 'Bar Bundle',   src: 'assets/products/bar_bundle.jpg',       group: 'Bars' },
      // Moons
      { key: 'moon_almond',      label: 'Almond',       src: 'assets/products/moon_almond.jpg',      group: 'Moons' },
      { key: 'moon_coconut',     label: 'Coconut',      src: 'assets/products/moon_coconut.jpg',     group: 'Moons' },
      { key: 'moon_hazelnut',    label: 'Hazelnut',     src: 'assets/products/moon_hazelnut.jpg',    group: 'Moons' },
      { key: 'moon_peppermint',  label: 'Peppermint',   src: 'assets/products/moon_peppermint.jpg',  group: 'Moons' },
      // Eclipses
      { key: 'eclipse_almond',   label: 'Almond',       src: 'assets/product_shots/eclipse_hazelnut_a.png',   group: 'Eclipses' },
      { key: 'eclipse_hazelnut', label: 'Hazelnut',     src: 'assets/product_shots/eclipse_hazelnut_a.png', group: 'Eclipses' },
      { key: 'eclipse_fudge',    label: 'Fudge',        src: 'assets/product_shots/eclipse_hazelnut_a.png',    group: 'Eclipses' },
      { key: 'eclipse_goji',     label: 'Goji',         src: 'assets/product_shots/eclipse_hazelnut_a.png',     group: 'Eclipses' },
      { key: 'eclipse_pecan',    label: 'Pecan',        src: 'assets/product_shots/eclipse_pecan.png',    group: 'Eclipses' },
      { key: 'eclipse_bundle',   label: 'Bundle',       src: 'assets/products/eclipse_bundle.jpg',   group: 'Eclipses' },
      // Bites
      { key: 'bite_coconut',     label: 'Coconut Bite', src: 'assets/product_shots/bite_coconut.png',     group: 'Bites' },
      { key: 'bite_gold',        label: 'Gold Bite',    src: 'assets/product_shots/bite_gold.png',        group: 'Bites' },
      // Other
      { key: 'elixir_plain',     label: 'Elixir Plain', src: 'assets/product_shots/elixir_plain.png',     group: 'Other' },
      { key: 'elixir_spiced',    label: 'Elixir Spiced',src: 'assets/product_shots/elixir_spiced.png',    group: 'Other' },
      { key: 'bananas',          label: 'Bananas',      src: 'assets/products/bananas.jpg',          group: 'Other' },
      { key: 'powder_roasted',   label: 'Powder',       src: 'assets/products/powder_roasted.jpg',   group: 'Other' },
      { key: 'bath_salts',       label: 'Bath Salts',   src: 'assets/product_shots/bath_salts_lavender.png',       group: 'Other' },
    ];

    var BG_SWATCHES = [
      { key: 'navy',        label: 'Navy',      hex: '#1E4366' },
      { key: 'dark',        label: 'Dark',      hex: '#1a1a1a' },
      { key: 'carob',       label: 'Carob',     hex: '#3a2a1a' },
      { key: 'blue_deep',   label: 'Blue Deep', hex: '#4A7B9D' },
      { key: 'teal',        label: 'Teal',      hex: '#2D6B7F' },
      { key: 'sky',         label: 'Sky Blue',  hex: '#7B9DBF' },
      { key: 'forest',      label: 'Forest',    hex: '#4a6b5a' },
      { key: 'cream',       label: 'Cream',     hex: '#E7E4CA' },
    ];

    var ICONS = [
      { key: 'organic',       label: 'Organic',       src: 'assets/icon_organic_full.svg' },
      { key: 'vegan',         label: 'Vegan',         src: 'assets/icon_vegan_full.svg' },
      { key: 'gluten_free',   label: 'Gluten Free',   src: 'assets/icon_gluten_free_full.svg' },
      { key: 'caffeine_free', label: 'Caffeine Free', src: 'assets/icon_caffeine_free_full.svg' },
      { key: 'made_in_aus',   label: 'Made in Aus',   src: 'assets/icon_made_in_aus_full.svg' },
      { key: 'additive_free', label: 'Additive Free', src: 'assets/icon_additive_free.svg' },
      { key: 'no_artificial', label: 'No Artificial', src: 'assets/icon_no_artificial.svg' },
    ];

    var FORMATS = {
      og:     { w: 1200, h: 628,  label: '1200 × 628 — Open Graph' },
      square: { w: 1080, h: 1080, label: '1080 × 1080 — Square' },
      story:  { w: 1080, h: 1920, label: '1080 × 1920 — Story' },
    };

    /* ── State ── */

    var state = {
      product:   'bar_original',
      bgColor:   '#1E4366',
      headline:  'Pure Carob. No Compromise.',
      subhead:   'Organic · Vegan · Handmade in Byron Bay',
      textColor: 'cream',
      icons:     ['organic', 'vegan', 'caffeine_free'],
      format:    'og',
    };

    /* ── Build Controls ── */

    function buildProductGrid() {
      var grid = document.getElementById('product-grid');
      var lastGroup = null;
      PRODUCTS.forEach(function(p) {
        if (p.group !== lastGroup) {
          lastGroup = p.group;
          var lbl = document.createElement('p');
          lbl.className = 'mm-group-label';
          lbl.textContent = p.group;
          lbl.setAttribute('aria-hidden', 'true');
          grid.appendChild(lbl);
        }
        var btn = document.createElement('button');
        btn.className = 'mm-product-tile' + (p.key === state.product ? ' mm-product-tile--active' : '');
        btn.setAttribute('role', 'radio');
        btn.setAttribute('aria-checked', p.key === state.product ? 'true' : 'false');
        btn.setAttribute('aria-label', p.label + ' (' + p.group + ')');
        btn.dataset.product = p.key;
        btn.dataset.src = p.src;
        var img = document.createElement('img');
        img.src = p.src;
        img.alt = '';
        img.loading = 'lazy';
        var span = document.createElement('span');
        span.textContent = p.label;
        btn.appendChild(img);
        btn.appendChild(span);
        grid.appendChild(btn);
      });
    }

    function buildSwatches() {
      var grid = document.getElementById('swatch-grid');
      BG_SWATCHES.forEach(function(s) {
        var btn = document.createElement('button');
        btn.className = 'mm-swatch' + (s.hex === state.bgColor ? ' mm-swatch--active' : '');
        btn.setAttribute('role', 'radio');
        btn.setAttribute('aria-checked', s.hex === state.bgColor ? 'true' : 'false');
        btn.setAttribute('aria-label', s.label);
        btn.title = s.label;
        btn.dataset.hex = s.hex;
        btn.style.background = s.hex;
        // Add light border for cream so it doesn't disappear on light bg
        if (s.hex === '#E7E4CA') btn.style.border = '2px solid rgba(30,67,102,0.2)';
        grid.appendChild(btn);
      });
    }

    function buildIconChips() {
      var wrap = document.getElementById('icon-chips');
      ICONS.forEach(function(ic) {
        var btn = document.createElement('button');
        var active = state.icons.indexOf(ic.key) !== -1;
        btn.className = 'mm-icon-chip' + (active ? ' mm-icon-chip--active' : '');
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        btn.dataset.icon = ic.key;
        var img = document.createElement('img');
        img.src = ic.src;
        img.alt = '';
        img.width = 14;
        img.height = 14;
        btn.appendChild(img);
        btn.appendChild(document.createTextNode(ic.label));
        wrap.appendChild(btn);
      });
    }

    /* ── Render ── */

    function render() {
      var fmt    = FORMATS[state.format];
      var canvas = document.getElementById('mm-canvas');
      var shell  = document.getElementById('preview-shell');
      var wrap   = shell.parentElement;

      // Background
      canvas.style.background = state.bgColor;

      // Scale to fit preview area — use wrap's actual rendered dimensions
      var wrapW  = wrap.clientWidth  || (window.innerWidth  - 320);
      var wrapH  = wrap.clientHeight || (window.innerHeight - 56);
      var availW = wrapW - 80;
      var availH = wrapH - 80;
      var scaleW = availW / fmt.w;
      var scaleH = availH / fmt.h;
      var scale  = Math.min(scaleW, scaleH, 1);

      canvas.style.width  = fmt.w + 'px';
      canvas.style.height = fmt.h + 'px';
      canvas.style.transform = 'scale(' + scale + ')';
      canvas.style.transformOrigin = 'top left';
      shell.style.width  = Math.round(fmt.w * scale) + 'px';
      shell.style.height = Math.round(fmt.h * scale) + 'px';

      // Product image
      var prod   = PRODUCTS.find(function(p) { return p.key === state.product; });
      var imgEl  = document.getElementById('canvas-product-img');
      if (imgEl.getAttribute('src') !== prod.src) {
        imgEl.src = prod.src;
        imgEl.alt = prod.label;
      }

      // Headline font size adapts to format
      var hlSize = state.format === 'story' ? 72 : state.format === 'og' ? 56 : 64;
      document.getElementById('canvas-headline').style.fontSize = hlSize + 'px';

      // Text content
      document.getElementById('canvas-headline').textContent = state.headline;
      document.getElementById('canvas-subhead').textContent  = state.subhead;

      // Text colour
      var tc = state.textColor === 'cream' ? '#E7E4CA' : '#1E4366';
      document.getElementById('canvas-text').style.color = tc;

      // Icon colour filter
      var iconFilter = state.textColor === 'cream'
        ? 'brightness(10) opacity(0.85)'
        : 'brightness(0) opacity(0.75)';

      // Icons
      var iconWrap = document.getElementById('canvas-icons');
      iconWrap.innerHTML = '';
      state.icons.forEach(function(key) {
        var ic = ICONS.find(function(i) { return i.key === key; });
        if (!ic) return;
        var img = document.createElement('img');
        img.src    = ic.src;
        img.alt    = ic.label;
        img.width  = 48;
        img.height = 48;
        img.className = 'mm-canvas__icon';
        img.style.filter = iconFilter;
        iconWrap.appendChild(img);
      });

      // Logo colour
      var logoImg = document.getElementById('canvas-logo-img');
      logoImg.style.filter = state.textColor === 'cream'
        ? 'brightness(10) opacity(0.9)'
        : 'brightness(0) opacity(0.8)';

      // Watermark colour
      var wmImg = document.querySelector('.mm-canvas__watermark img');
      wmImg.style.filter = state.textColor === 'cream'
        ? 'brightness(10)'
        : 'brightness(0)';

      // Format label
      document.getElementById('preview-label').textContent = fmt.label;
    }

    function syncTextColorBtns() {
      document.querySelectorAll('#text-color-group .mm-toggle-btn').forEach(function(b) {
        var active = b.dataset.textColor === state.textColor;
        b.classList.toggle('mm-toggle-btn--active', active);
        b.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }

    /* ── SVG inlining helper for export ── */

    function inlineSVGs(element) {
      var imgs = element.querySelectorAll('img[src$=".svg"]');
      var promises = Array.prototype.map.call(imgs, function(img) {
        return fetch(img.src)
          .then(function(r) { return r.text(); })
          .then(function(text) {
            try {
              var b64 = btoa(unescape(encodeURIComponent(text)));
              img.src = 'data:image/svg+xml;base64,' + b64;
            } catch(e) {
              console.warn('SVG inline failed:', img.src, e);
            }
          })
          .catch(function(e) {
            console.warn('SVG fetch failed:', img.src, e);
          });
      });
      return Promise.all(promises);
    }

    /* ── Export ── */

    function exportPNG() {
      var btn = document.getElementById('btn-export');
      btn.textContent = 'Exporting…';
      btn.disabled = true;

      var canvas = document.getElementById('mm-canvas');
      var fmt    = FORMATS[state.format];
      var prod   = PRODUCTS.find(function(p) { return p.key === state.product; });

      var savedTransform = canvas.style.transform;
      canvas.style.transform = 'none';

      html2canvas(canvas, {
        width:       fmt.w,
        height:      fmt.h,
        scale:       1,
        useCORS:     true,
        allowTaint:  false,
        logging:     false,
        backgroundColor: null,
        imageTimeout: 15000,
        onclone: function(clonedDoc) {
          var cl = clonedDoc.getElementById('mm-canvas');
          cl.style.transform = 'none';
          return inlineSVGs(cl);
        }
      }).then(function(result) {
        canvas.style.transform = savedTransform;

        var d = new Date();
        var stamp = '' + d.getFullYear()
          + String(d.getMonth() + 1).padStart(2, '0')
          + String(d.getDate()).padStart(2, '0');
        var filename = 'maplemoon_mockup_' + prod.key + '_' + state.format + '_' + stamp + '.png';

        var link = document.createElement('a');
        link.download = filename;
        link.href = result.toDataURL('image/png');
        link.click();

        btn.textContent = 'Export PNG';
        btn.disabled = false;
      }).catch(function(err) {
        canvas.style.transform = savedTransform;
        console.error('Export failed:', err);
        alert('Export failed — see console for details.');
        btn.textContent = 'Export PNG';
        btn.disabled = false;
      });
    }

    /* ── Init & Events ── */

    (function init() {
      buildProductGrid();
      buildSwatches();
      buildIconChips();

      // Product tiles
      document.getElementById('product-grid').addEventListener('click', function(e) {
        var tile = e.target.closest('.mm-product-tile');
        if (!tile) return;
        state.product = tile.dataset.product;
        document.querySelectorAll('.mm-product-tile').forEach(function(t) {
          var active = t === tile;
          t.classList.toggle('mm-product-tile--active', active);
          t.setAttribute('aria-checked', active ? 'true' : 'false');
        });
        render();
      });

      // Swatches
      document.getElementById('swatch-grid').addEventListener('click', function(e) {
        var sw = e.target.closest('.mm-swatch');
        if (!sw) return;
        state.bgColor = sw.dataset.hex;
        // Auto-switch text colour for cream bg
        if (sw.dataset.hex === '#E7E4CA') {
          state.textColor = 'navy';
        } else {
          state.textColor = 'cream';
        }
        document.querySelectorAll('.mm-swatch').forEach(function(s) {
          var active = s === sw;
          s.classList.toggle('mm-swatch--active', active);
          s.setAttribute('aria-checked', active ? 'true' : 'false');
        });
        syncTextColorBtns();
        render();
      });

      // Text inputs — debounced
      var textTimer;
      ['input-headline', 'input-subhead'].forEach(function(id) {
        document.getElementById(id).addEventListener('input', function() {
          clearTimeout(textTimer);
          textTimer = setTimeout(function() {
            state.headline = document.getElementById('input-headline').value;
            state.subhead  = document.getElementById('input-subhead').value;
            render();
          }, 120);
        });
      });

      // Text colour
      document.getElementById('text-color-group').addEventListener('click', function(e) {
        var btn = e.target.closest('.mm-toggle-btn');
        if (!btn || !btn.dataset.textColor) return;
        state.textColor = btn.dataset.textColor;
        syncTextColorBtns();
        render();
      });

      // Icon chips
      document.getElementById('icon-chips').addEventListener('click', function(e) {
        var chip = e.target.closest('.mm-icon-chip');
        if (!chip) return;
        var key = chip.dataset.icon;
        var idx = state.icons.indexOf(key);
        if (idx === -1) {
          state.icons.push(key);
          chip.classList.add('mm-icon-chip--active');
          chip.setAttribute('aria-pressed', 'true');
        } else {
          state.icons.splice(idx, 1);
          chip.classList.remove('mm-icon-chip--active');
          chip.setAttribute('aria-pressed', 'false');
        }
        render();
      });

      // Format
      document.getElementById('format-group').addEventListener('click', function(e) {
        var btn = e.target.closest('.mm-toggle-btn');
        if (!btn || !btn.dataset.format) return;
        state.format = btn.dataset.format;
        document.querySelectorAll('#format-group .mm-toggle-btn').forEach(function(b) {
          var active = b === btn;
          b.classList.toggle('mm-toggle-btn--active', active);
          b.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
        render();
      });

      // Export
      document.getElementById('btn-export').addEventListener('click', exportPNG);

      // Re-render on window resize
      window.addEventListener('resize', render);

      // Initial render — defer until after layout is painted
      requestAnimationFrame(function() { requestAnimationFrame(render); });
    })();
  </script>

</body>
