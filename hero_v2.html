<style>


  :root {
    --z-product: 2;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    background: linear-gradient(180deg, var(--mm-blue-top) 0%, var(--mm-blue-bottom) 100%);
    font-family: var(--mm-sans);
    color: var(--mm-cream);
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    text-rendering: optimizeLegibility;
  }
  @keyframes gradDrift {
    0%   { background-position: 25% 15%; }
    25%  { background-position: 78% 28%; }
    50%  { background-position: 55% 80%; }
    75%  { background-position: 12% 55%; }
    100% { background-position: 25% 15%; }
  }
  @keyframes gradDrift2 {
    0%   { background-position: 75% 80%; }
    33%  { background-position: 22% 42%; }
    66%  { background-position: 68% 18%; }
    100% { background-position: 75% 80%; }
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 72% 62% at 25% 15%, rgba(135,173,207,0.55) 0%, transparent 65%);
    background-size: 230% 230%;
    z-index: 0;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 55% 45% at 75% 80%, rgba(168,189,212,0.32) 0%, transparent 60%);
    background-size: 230% 230%;
    z-index: 0;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: no-preference) {
    body::before { animation: gradDrift 17s ease-in-out infinite; }
    body::after  { animation: gradDrift2 24s ease-in-out infinite; }
  }

  /* skip-link, focus-visible → brand_kit.css */

  /* ── Product image entrance (scale-up) ── */
  @keyframes productEntrance {
    from { opacity: 0; transform: scale(0.95); }
    to   { opacity: 1; transform: scale(1); }
  }
  /* ── CTA pulse ── */
  @keyframes ctaPulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--mm-cream-40); }
    50% { box-shadow: 0 0 0 8px rgba(231,228,202,0); }
  }
  @media (prefers-reduced-motion: no-preference) {
    .fade-1 { animation: fadeIn 0.6s ease both 0.1s; }
    .fade-2 { animation: fadeIn 0.6s ease both 0.25s; }
    .fade-product { animation: productEntrance 0.6s ease-out both 0.3s; }
    .fade-3 { animation: fadeIn 0.6s ease both 0.4s; }
    .fade-4 { animation: fadeIn 0.6s ease both 0.55s; }
    .fade-5 { animation: fadeIn 0.6s ease both 0.7s; }
    .fade-6 { animation: fadeIn 0.6s ease both 0.85s; }
  }

  /* ── Back link ── */
  .back-link {
    position: fixed; top: 12px; left: 12px; z-index: calc(var(--z-fixed) + 1);
    color: var(--mm-cream); text-decoration: none;
    font-family: var(--mm-sans); font-size: 0.7rem; font-weight: 400;
    opacity: 0.4; transition: opacity 0.2s;
    display: none; min-height: 44px; padding: 12px 16px;
  }
  .back-link:hover { opacity: 1; }

  /* ── Hamburger (mobile only) ── */
  #menu-toggle { display: none; }

  .hamburger {
    position: fixed; top: 12px; left: 12px; z-index: var(--z-tooltip);
    cursor: pointer; display: flex; flex-direction: column;
    justify-content: center; gap: 5px; width: 44px; height: 44px;
    padding: 8px;
  }
  .hamburger span {
    display: block; width: 100%; height: 2px;
    background: var(--mm-cream); border-radius: 1px;
    transition: transform 0.3s, opacity 0.3s;
  }
  #menu-toggle:checked ~ .hamburger span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
  #menu-toggle:checked ~ .hamburger span:nth-child(2) { opacity: 0; }
  #menu-toggle:checked ~ .hamburger span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

  #main:focus { outline: none; }

  .menu-close {
    position: absolute; top: 20px; right: 20px;
    background: none; border: none; cursor: pointer;
    font-size: 1.5rem; color: var(--mm-navy); opacity: 0.5;
    padding: 12px; min-width: 44px; min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s;
  }
  .menu-close:hover { opacity: 1; }

  /* ── Mobile menu overlay ── */
  .mobile-menu {
    position: fixed; inset: 0; z-index: var(--z-modal);
    background: var(--mm-cream); color: var(--mm-navy);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 28px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #menu-toggle:checked ~ .mobile-menu { opacity: 1; pointer-events: auto; }

  .mobile-menu a {
    font-family: var(--mm-serif); font-size: 1.4rem;
    font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--mm-navy); text-decoration: none;
    transition: opacity 0.2s;
    min-height: 44px; padding: 12px 0;
    display: inline-flex; align-items: center;
  }
  .mobile-menu a:hover { opacity: 0.6; }

  .mobile-menu .menu-divider {
    width: 40px; height: 1px; background: var(--mm-navy); opacity: 0.2;
  }

  .mobile-menu .menu-nav {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    margin-top: 24px; padding-top: 24px;
    border-top: 1px solid var(--mm-navy-15);
  }
  .mobile-menu .menu-nav a {
    font-family: var(--mm-sans); font-size: 0.95rem;
    font-weight: 400; text-transform: none; letter-spacing: 0.02em;
    color: var(--mm-navy); opacity: 0.6;
  }

  /* ── Mobile header ── */
  .header-mobile {
    position: fixed; top: 0; left: 0; right: 0; z-index: var(--z-fixed);
    display: flex; justify-content: flex-end; align-items: flex-start;
    padding: 20px;
  }
  .header-mobile .logo-img { width: 72px; height: auto; }

  /* ── Desktop nav bar ── */
  .header-desktop {
    display: none;
  }

  /* ── Hero layout ── */
  .hero {
    position: relative; width: 100%; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
    gap: 20px;
  }

  /* ── Product ── */
  .product-img {
    width: 88%; max-width: 390px; height: auto;
    filter: drop-shadow(0 4px 8px var(--mm-black-10)) drop-shadow(0 16px 32px var(--mm-black-15)) drop-shadow(0 32px 64px var(--mm-black-10));
    position: relative; z-index: var(--z-product);
    transition: transform 0.4s ease;
    margin-top: 40px;
  }

  /* ── Tagline ── */
  .tagline {
    font-family: var(--mm-sans); font-weight: 300;
    font-size: 1.05rem; color: var(--mm-cream); opacity: 0.85;
    text-align: center; position: relative; z-index: var(--z-product);
    text-wrap: balance;
  }

  /* ── CTA ── */
  .cta-btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--mm-cream); color: var(--mm-cream);
    background: transparent; border-radius: var(--radius-pill);
    padding: 12px 32px; min-height: 48px;
    font-family: var(--mm-serif); font-size: 0.9rem;
    font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
    text-decoration: none; cursor: pointer;
    transition: background 0.3s, color 0.3s, transform 0.15s;
    position: relative; z-index: var(--z-product);
    margin-top: 12px;
  }
  .cta-btn:hover {
    background: var(--mm-cream); color: var(--mm-blue-top);
  }
  .cta-btn:active {
    transform: scale(0.97);
    background: var(--mm-cream); color: var(--mm-blue-top);
  }

  @media (prefers-reduced-motion: no-preference) {
    .cta-btn { animation: ctaPulse 1.5s ease 1.5s 1; }
  }

  /* ── Categories (mobile): horizontal scroll strip ── */
  .category-strip {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: var(--z-dropdown);
    padding: 20px 0 max(32px, env(safe-area-inset-bottom));
    overflow-x: auto; overflow-y: hidden;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x mandatory;
    mask-image: linear-gradient(to right, transparent 0%, black 8%, black 85%, transparent 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 85%, transparent 100%);
    text-align: center;
  }
  .category-strip .inner {
    display: inline-flex; align-items: center; gap: 0;
    padding: 0 24px;
  }
  .category-strip a {
    scroll-snap-align: center;
    font-family: var(--mm-serif); font-size: 0.9rem;
    font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--mm-cream); text-decoration: none;
    padding: 10px 0; min-height: 44px; white-space: nowrap;
    transition: opacity 0.2s;
    display: inline-flex; align-items: center;
  }
  .category-strip a { opacity: 0.5; }
  .category-strip a:hover { opacity: 0.75; }
  .category-strip a.active {
    opacity: 1;
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 5px;
    text-decoration-thickness: 1px;
  }
  .category-strip .dot {
    display: inline-block; width: 4px; height: 4px;
    background: var(--mm-cream); border-radius: var(--radius-full);
    margin: 0 12px; opacity: 0.5; flex-shrink: 0;
  }

  /* ── Category strip scroll indicator ── */
  .strip-progress {
    position: fixed; bottom: 0; left: 0; z-index: calc(var(--z-dropdown) + 1);
    height: 2px; width: 0%;
    background: var(--mm-cream); opacity: 0.3;
    transition: width 0.1s linear;
  }

  /* ── Watermark overrides: full-bleed edge-to-edge + opacity lift ── */
  .carob-watermark-wrap.wm-subtle img {
    width: 110%;
    max-width: none;
    opacity: 0.08;
  }

  /* ── Desktop category bar (bottom) ── */
  .category-bar-desktop {
    display: none;
  }

  /* ── DESKTOP ── */
  @media (min-width: 768px) {
    .hamburger { display: none; }
    .header-mobile { display: none; }
    .category-strip { display: none; }
    .back-link { display: block; }

    /* Desktop nav */
    .header-desktop {
      display: flex; align-items: center;
      position: fixed; top: 0; left: 0; right: 0; z-index: var(--z-fixed);
      padding: 28px 40px;
      transition: background 0.3s ease, backdrop-filter 0.3s ease;
    }
    .header-desktop.scrolled {
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      background: rgba(123, 157, 191, 0.6);
      border-bottom: 1px solid var(--mm-cream-10);
    }
    @supports not (backdrop-filter: blur(1px)) {
      .header-desktop.scrolled { background: rgba(123, 157, 191, 0.85); }
    }
    .header-desktop nav {
      flex: 1; display: flex; align-items: center;
      justify-content: center; gap: 40px;
    }
    .header-desktop nav a {
      font-family: var(--mm-sans); font-size: 0.85rem;
      font-weight: 400; letter-spacing: 0.07em;
      color: var(--mm-cream); text-decoration: none;
      opacity: 0.7; transition: opacity 0.2s;
    }
    .header-desktop nav a:hover { opacity: 1; }
    .header-desktop .logo-desktop {
      width: 160px; height: auto; margin-left: auto; flex-shrink: 0;
    }

    /* Hero clearance: top for nav, bottom for category bar */
    .hero { padding-top: 120px; padding-bottom: 80px; }

    /* Watermark */

    /* Product */
    .product-img {
      width: auto; height: 50vh; max-height: 520px; max-width: 420px;
      filter: drop-shadow(0 4px 8px var(--mm-black-10)) drop-shadow(0 16px 32px var(--mm-black-15)) drop-shadow(0 32px 64px var(--mm-black-10));
      transform: translateY(0);
      margin-top: 0;
    }
    .product-img:hover {
      transform: scale(1.03);
    }

    /* Tagline */
    .tagline { font-size: 1.45rem; letter-spacing: 0.01em; }

    /* CTA */
    .cta-btn {
      padding: 14px 40px; font-size: 0.95rem;
    }

    /* Desktop category bar */
    .category-bar-desktop {
      display: flex; align-items: center; justify-content: center; gap: 0;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: var(--z-dropdown);
      padding: 24px 0 32px;
    }
    .category-bar-desktop a {
      font-family: var(--mm-serif); font-size: 1.3rem;
      font-weight: 500; text-transform: uppercase; letter-spacing: 0.15em;
      color: var(--mm-cream); text-decoration: none;
      opacity: 0.5; transition: opacity 0.2s;
    }
    .category-bar-desktop a:hover { opacity: 0.75; }
    .category-bar-desktop a.active {
      opacity: 1;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 1px;
    }
    .category-bar-desktop .dot {
      display: inline-block; width: 5px; height: 5px;
      background: var(--mm-cream); border-radius: var(--radius-full);
      margin: 0 20px; opacity: 0.4;
    }
  }

  @media (min-width: 1024px) {
    .header-desktop { padding: 32px 48px; }
    .header-desktop nav { gap: 52px; }
    .tagline { font-size: 1.7rem; }
  }
</style>

<body>

<!-- Focus trap + glassmorphism scroll + auto-close -->
<script>
(function() {
  var toggle = document.getElementById('menu-toggle');
  var menu = document.querySelector('.mobile-menu');
  var hamburger = document.querySelector('.hamburger');
  // Auto-close on link tap
  document.querySelectorAll('.mobile-menu a').forEach(function(link) {
    link.addEventListener('click', function() { toggle.checked = false; toggle.dispatchEvent(new Event('change')); });
  });

  // Close button
  var closeBtn = document.querySelector('.menu-close');
  if (closeBtn) {
    closeBtn.addEventListener('click', function() { toggle.checked = false; toggle.dispatchEvent(new Event('change')); });
  }

  // Focus trap on mobile menu
  toggle.addEventListener('change', function() {
    var isOpen = toggle.checked;
    menu.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
    hamburger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    if (!isOpen) { hamburger.focus(); return; }
    var focusable = menu.querySelectorAll('a, button, [tabindex]');
    if (!focusable.length) return;
    var first = focusable[0], last = focusable[focusable.length - 1];
    function trap(e) {
      if (e.key === 'Escape') { toggle.checked = false; toggle.dispatchEvent(new Event('change')); return; }
      if (e.key !== 'Tab') return;
      if (e.shiftKey) { if (document.activeElement === first) { e.preventDefault(); last.focus(); } }
      else { if (document.activeElement === last) { e.preventDefault(); first.focus(); } }
    }
    menu.addEventListener('keydown', trap);
    first.focus();
    var observer = new MutationObserver(function() {
      if (!toggle.checked) { menu.removeEventListener('keydown', trap); observer.disconnect(); }
    });
    observer.observe(toggle, { attributes: true });
  });

  // Glassmorphism nav on scroll (desktop)
  var header = document.querySelector('.header-desktop');
  if (header) {
    window.addEventListener('scroll', function() {
      if (window.scrollY > 60) { header.classList.add('scrolled'); }
      else { header.classList.remove('scrolled'); }
    }, { passive: true });
  }
})();
</script>


<!-- Category strip scroll indicator -->
<script>
(function() {
  var strip = document.querySelector('.category-strip');
  var bar = document.getElementById('stripProgress');
  if (!strip || !bar) return;
  strip.addEventListener('scroll', function() {
    var maxScroll = strip.scrollWidth - strip.clientWidth;
    if (maxScroll <= 0) { bar.style.width = '0%'; return; }
    var pct = (strip.scrollLeft / maxScroll) * 100;
    bar.style.width = pct + '%';
  }, { passive: true });
})();
</script>
