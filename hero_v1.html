  /* [17] z-index — page-specific tokens (matching values use brand_kit vars below) */
  :root {
    --z-product: 2;
    --z-carob: 1;
  }

  /* [1] Overflow locked on html+body — no redundant override on body */
  html, body { height: 100%; overflow: hidden; }

  body {
    /* [8] Use brand_kit color tokens — removed --grad-top/--grad-bottom */
    background: linear-gradient(180deg, var(--mm-blue-top) 0%, var(--mm-blue-bottom) 100%);
    font-family: var(--mm-sans);
    color: var(--mm-cream);
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    text-rendering: optimizeLegibility;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    /* [23] Exact --mm-sky channels: #87ADCF = rgb(135,173,207) */
    background: radial-gradient(ellipse at 30% 20%, rgba(135,173,207,0.4) 0%, transparent 60%);
    z-index: 0;
    pointer-events: none;
  }

  /* [7] Skip-link focus target — suppress outline ring on main container */
  .hero:focus { outline: none; }

  /* skip-link, focus-visible base → brand_kit.css */

  /* ── Product image entrance (scale-up) ── */
  /* [3] @keyframes fadeIn removed — use brand_kit.css definition (translateY 8px) */
  @keyframes productEntrance {
    from { opacity: 0; transform: scale(0.95); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* [2][29] All entrance animations wrapped — respect prefers-reduced-motion */
  @media (prefers-reduced-motion: no-preference) {
    .fade-1 { animation: fadeIn 0.6s ease both 0.1s; }
    .fade-2 { animation: fadeIn 0.6s ease both 0.25s; }
    /* [29] fade-product inside reduced-motion guard */
    .fade-product { animation: productEntrance 0.6s ease-out both 0.3s; }
    .fade-3 { animation: fadeIn 0.6s ease both 0.4s; }
    .fade-4 { animation: fadeIn 0.6s ease both 0.55s; }
    .fade-5 { animation: fadeIn 0.6s ease both 0.7s; }
    /* [20] catFadeIn deleted — stagger classes now use brand_kit fadeIn */
    .cat-stagger-1 { animation: fadeIn 0.4s ease both 0.3s; }
    .cat-stagger-2 { animation: fadeIn 0.4s ease both 0.35s; }
    .cat-stagger-3 { animation: fadeIn 0.4s ease both 0.4s; }
    .cat-stagger-4 { animation: fadeIn 0.4s ease both 0.45s; }
    .cat-stagger-5 { animation: fadeIn 0.4s ease both 0.5s; }
    .cat-stagger-6 { animation: fadeIn 0.4s ease both 0.55s; }
    .cat-stagger-7 { animation: fadeIn 0.4s ease both 0.6s; }
  }

  /* ── Back link ── */
  .back-link {
    position: fixed; top: 12px; left: 12px;
    /* [17] z-index: one above --z-fixed (100) */

    font-family: var(--mm-sans); font-size: 0.8rem; font-weight: 400;

    display: none; min-height: 44px; padding: 12px 16px;
  }
  .back-link:hover { opacity: 1; }

  /* ── Hamburger (mobile only) ── */
  #menu-toggle { display: none; }

  .hamburger {
    position: fixed; top: 12px; left: 12px;
    /* [17] --z-tooltip: 200 */
    z-index: var(--z-tooltip);
    cursor: pointer; display: flex; flex-direction: column;
    justify-content: center; gap: 5px; width: 44px; height: 44px;

  .hamburger span {

  #menu-toggle:checked ~ .hamburger span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
  #menu-toggle:checked ~ .hamburger span:nth-child(2) { opacity: 0; }
  #menu-toggle:checked ~ .hamburger span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

  /* ── Mobile menu overlay ── */
  .mobile-menu {

<script>
/* ── Menu: auto-close, focus trap, glassmorphism scroll ── */
(function() {
  var toggle = document.getElementById('menu-toggle');
  var menu = document.querySelector('.mobile-menu');
  var hamburger = document.querySelector('.hamburger');

  // Auto-close on link tap
  document.querySelectorAll('.mobile-menu a').forEach(function(link) {
    link.addEventListener('click', function() { toggle.checked = false; toggle.dispatchEvent(new Event('change')); });
  });

  // [19] Close button
  var closeBtn = document.querySelector('.menu-close');
  if (closeBtn) {
    closeBtn.addEventListener('click', function() { toggle.checked = false; toggle.dispatchEvent(new Event('change')); });
  }

  // [5] Focus trap — observer declared in outer scope to prevent memory leak
  var observer = null;
  toggle.addEventListener('change', function() {
    var isOpen = toggle.checked;
    menu.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
    hamburger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    if (!isOpen) { hamburger.focus(); return; }
    var focusable = menu.querySelectorAll('a, button, [tabindex]');
    if (!focusable.length) return;
    var first = focusable[0], last = focusable[focusable.length - 1];
    function trap(e) {
      if (e.key === 'Escape') { toggle.checked = false; toggle.dispatchEvent(new Event('change')); return; }
      if (e.key !== 'Tab') return;
      if (e.shiftKey) { if (document.activeElement === first) { e.preventDefault(); last.focus(); } }
      else { if (document.activeElement === last) { e.preventDefault(); first.focus(); } }
    }
    menu.addEventListener('keydown', trap);
    first.focus();
    if (observer) { observer.disconnect(); }
    observer = new MutationObserver(function() {
      if (!toggle.checked) { menu.removeEventListener('keydown', trap); observer.disconnect(); }
    });
    observer.observe(toggle, { attributes: true });
  });

  // Glassmorphism nav on scroll (desktop)
  var header = document.querySelector('.header');
  if (header) {
    window.addEventListener('scroll', function() {
      header.classList.toggle('scrolled', window.scrollY > 60);
    }, { passive: true });
  }
})();

/* ── Category hover/click → product switcher ── */
(function() {
  var catLinks = document.querySelectorAll('[data-cat]');
  var productImgs = document.querySelectorAll('.product-stage img[data-cat]');
  var productStage = document.querySelector('.product-stage');

  function switchProduct(cat) {
    var activeName = '';
    productImgs.forEach(function(img) {
      var isActive = img.dataset.cat === cat;
      img.classList.toggle('active', isActive);
      if (isActive) { activeName = img.alt; }
    });
    catLinks.forEach(function(link) {
      link.classList.toggle('active', link.dataset.cat === cat);
    });
    // [6] Update ARIA label so screen readers announce the new product
    if (productStage && activeName) {
      productStage.setAttribute('aria-label', 'Selected product: ' + activeName);
    }
  }

  function getSelectedCat() {
    // [21] Explicit selector per viewport — avoids cross-panel false matches
    var sel = window.innerWidth >= 768
      ? '.category-stack-desktop a.active'
      : '.category-strip-mobile a.active';
    var el = document.querySelector(sel);
    return el ? el.dataset.cat : null;
  }

  function previewProduct(cat) {
    productImgs.forEach(function(img) {
      img.classList.toggle('active', img.dataset.cat === cat);
    });
  }

  catLinks.forEach(function(link) {
    // Hover + [14] keyboard focus: preview product, restore on leave/blur
    link.addEventListener('mouseenter', function() { previewProduct(link.dataset.cat); });
    link.addEventListener('focus',      function() { previewProduct(link.dataset.cat); });
    link.addEventListener('mouseleave', function() {
      var sel = getSelectedCat();
      if (sel) { previewProduct(sel); }
    });
    link.addEventListener('blur', function() {
      var sel = getSelectedCat();
      if (sel) { previewProduct(sel); }
    });
    // Click: lock selection
    link.addEventListener('click', function(e) {
      e.preventDefault();
      switchProduct(link.dataset.cat);
    });
  });
})();

/* ── Category strip scroll indicator ── */
(function() {
  var strip = document.querySelector('.category-strip-mobile');
  var bar = document.getElementById('stripProgress');
  if (!strip || !bar) return;
  var ticking = false;
  strip.addEventListener('scroll', function() {
    if (!ticking) {
      requestAnimationFrame(function() {
        // [16] Guard — strip is hidden on desktop, skip unnecessary work
        if (getComputedStyle(strip).display === 'none') { ticking = false; return; }
        var maxScroll = strip.scrollWidth - strip.clientWidth;
        if (maxScroll <= 0) { bar.style.width = '0%'; ticking = false; return; }
        bar.style.width = (strip.scrollLeft / maxScroll) * 100 + '%';
        ticking = false;
      });
      ticking = true;
    }
  }, { passive: true });
})();
</script>
