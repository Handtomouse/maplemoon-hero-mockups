<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maple Moon: Letterbox Cinema</title>
<meta name="description" content="Enter the world of Maple Moon: artisan carob from Byron Bay. Organic, vegan, caffeine-free.">
<meta name="theme-color" content="#08101e">
<meta property="og:title" content="Maple Moon: Letterbox Cinema">
<meta property="og:description" content="Enter the world of Maple Moon: artisan carob from Byron Bay. Organic, vegan, caffeine-free.">
<meta property="og:type" content="website">
<meta property="og:image" content="/assets/product_shots/bar_pure_carob.png">
<meta property="og:image:width" content="400">
<meta property="og:image:height" content="600">
<meta property="og:site_name" content="Maple Moon">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Maple Moon: Letterbox Cinema">
<meta name="twitter:description" content="Artisan carob and cacao butter, handmade in Byron Bay. Organic, vegan, caffeine-free.">
<meta name="twitter:image" content="/assets/product_shots/bar_pure_carob.png">
<link rel="canonical" href="https://maplemoon-hero-mockups.vercel.app/hero_v10.html">

<link rel="preload" as="image" href="assets/hero_shots/hero_bar_lineup.jpg">
<link rel="preload" as="image" href="assets/carob_wordmark.svg">
<link rel="icon" href="assets/maplemoon_logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/maplemoon_logo.svg">
<style>


  :root {
    --bar-height: 60px;
    --z-product: 2;
    --letterbox-bar: #08101e;
    --mm-navy-40: rgba(30,67,102,0.4);
    --mm-navy-60: rgba(30,67,102,0.6);
  }

  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--mm-sans);
    color: var(--mm-cream);
    background: var(--mm-dark-bg);
    text-rendering: optimizeLegibility;
  }


  /* ── Back link ── */
  .back-link {
    position: fixed; top: 16px; left: 16px; z-index: calc(var(--z-fixed) + 1);
    color: var(--mm-cream); text-decoration: none;
    font-family: var(--mm-sans); font-size: 0.8rem; font-weight: 400;
    opacity: 0.7; transition: opacity 0.2s;
    display: block; min-height: 44px; padding: 12px 0;
  }
  .back-link:hover { opacity: 1; }

  /* Skip link: override brand-kit absolute → fixed so it shows above overflow:hidden html/body */
  .skip-link { position: fixed; }

  #main:focus { outline: none; }

  /* ── Fade-in ── */
  @keyframes fadeInSlow {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  /* Intentional cinematic override — slower than brand-kit defaults (0.8s vs 0.6s)
     to match the title-card entrance feel. Do not normalise to brand-kit timing. */
  @media (prefers-reduced-motion: no-preference) {
    .fade-1 { animation: fadeIn 0.8s ease both 0.3s; }
    .fade-2 { animation: fadeIn 0.8s ease both 0.6s; }
    .fade-3 { animation: fadeIn 0.8s ease both 0.9s; }
    .fade-4 { animation: fadeIn 0.8s ease both 1.2s; }
    .fade-bars { animation: fadeInSlow 1.2s ease both 0s; }
  }

  /* ═══════════════════════════════════
     V10 — LETTERBOX CINEMA
  ═══════════════════════════════════ */

  /* ── Letterbox bars ── */
  .letterbox-top {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--bar-height);
    background: var(--letterbox-bar);
    z-index: var(--z-dropdown);
    display: flex; align-items: center; justify-content: center;
  }
  .letterbox-top .bar-text {
    font-family: var(--mm-sans);
    font-size: 0.65rem; font-weight: 400;
    color: var(--mm-cream); opacity: 0.8;
    text-transform: uppercase;
    letter-spacing: 0.3em;
  }

  .letterbox-bottom {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: var(--bar-height);
    background: var(--letterbox-bar);
    z-index: var(--z-dropdown);
    display: flex; align-items: center; justify-content: center;
    gap: 8px;
  }
  .letterbox-bottom img {
    width: 20px; height: 20px;
    filter: brightness(0) invert(0.92) sepia(0.1) saturate(0.3);
    opacity: 0.5;
  }

  /* ── Content area ── */
  .cinema-viewport {
    position: fixed;
    top: var(--bar-height);
    left: 0; right: 0;
    height: calc(100dvh - var(--bar-height) * 2);
    overflow: hidden;
  }

  /* ── Ken Burns background ── */
  .cinema-bg {
    position: absolute; inset: 0;
    z-index: 0;
    background-color: var(--mm-navy); /* fallback while hero_bar_lineup.jpg loads */
  }
  .cinema-bg img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  @media (prefers-reduced-motion: no-preference) {
    @keyframes kenBurns {
      0% { transform: scale(1) translateX(0) translateZ(0); }
      100% { transform: scale(1.15) translateX(0) translateZ(0); }
    }
    .cinema-bg img {
      animation: kenBurns 25s ease-in-out infinite alternate;
      will-change: transform;
      transform: translateZ(0); /* promote to GPU layer */
    }
  }
  .cinema-bg::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(var(--mm-navy-40), var(--mm-navy-60));
    z-index: var(--z-base);
    pointer-events: none;
  }

  /* ── Title card content ── */
  .cinema-content {
    position: relative; z-index: var(--z-product);
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    gap: 16px;
    padding: 0 32px 12vh;
    text-align: center;
  }

  .cinema-wordmark {
    width: 65%; max-width: 260px;
    height: auto;
    opacity: 0.85;
    filter: brightness(0) invert(0.92) sepia(0.1) saturate(0.3);
  }

  .cinema-tagline {
    font-family: var(--mm-sans);
    font-weight: 300; font-size: 0.95rem;
    color: var(--mm-cream); opacity: 0.8;
    letter-spacing: 0.15em;
  }

  .cinema-origin {
    font-family: var(--mm-sans);
    font-weight: 400; font-size: 0.75rem;
    color: var(--mm-cream); opacity: 0.65;
    letter-spacing: 0.1em;
  }

  .cinema-enter {
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--mm-cream); color: var(--mm-cream);
    background: transparent; border-radius: var(--radius-pill);
    padding: 10px 32px; min-height: 44px;
    font-family: var(--mm-sans); font-size: 0.8rem;
    font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase;
    text-decoration: none; cursor: pointer;
    transition: background 0.4s, color 0.4s, transform 0.15s;
    margin-top: 8px;
  }
  .cinema-enter:hover {
    background: var(--mm-cream); color: var(--mm-navy);
  }
  .cinema-enter:active {
    transform: scale(0.97);
  }

  /* ═══════════════════════════════════
     DESKTOP
  ═══════════════════════════════════ */
  @media (min-width: 768px) {
    :root {
      --bar-height: 80px;
    }

    .back-link { display: block; z-index: calc(var(--z-fixed) + 1); }

    /* Letterbox bottom: add text */
    .letterbox-bottom {
      gap: 16px;
    }
    .letterbox-bottom .shipping-text {
      display: inline;
    }

    /* Ken Burns: slower, with pan */
    @media (prefers-reduced-motion: no-preference) {
      @keyframes kenBurnsDesktop {
        0% { transform: scale(1) translateX(0); }
        50% { transform: scale(1.1) translateX(-2%); }
        100% { transform: scale(1.15) translateX(1%); }
      }
      .cinema-bg img {
        animation: kenBurnsDesktop 30s ease-in-out infinite alternate;
      }
    }

    /* Wordmark — sized to sit above bar */
    .cinema-wordmark {
      width: 40%; max-width: 360px;
    }

    /* Push text to bottom-left */
    .cinema-content {
      align-items: flex-start;
      justify-content: flex-end;
      padding-top: 0;
      padding-bottom: 10vh;
      padding-left: 8%;
      text-align: left;
    }

    .cinema-tagline {
      font-size: 1rem;
      letter-spacing: 0.18em;
    }

    .cinema-origin {
      font-size: 0.85rem;
    }

    .cinema-enter {
      padding: 14px 48px;
      font-size: 0.9rem;
      margin-top: 16px;
    }

    .letterbox-bottom img {
      width: 24px; height: 24px;
    }
  }

  /* ── Short-phone layout ── */
  @media (max-height: 620px) {
    .cinema-content {
      padding-top: 6vh;
      gap: 10px;
    }
  }

  /* ── Shipping text hidden on mobile ── */
  .letterbox-bottom .shipping-text {
    display: none;
    font-family: var(--mm-sans);
    font-size: 0.65rem; font-weight: 300;
    color: var(--mm-cream); opacity: 0.4;
    letter-spacing: 0.08em;
    margin-left: 16px;
  }
  @media (min-width: 768px) {
    .letterbox-bottom .shipping-text { display: inline; }
  }
</style>
</head>
<body>

<a href="#main" class="skip-link">Skip to content</a>
<a href="index.html" class="back-link">&larr; Back to Gallery</a>

<!-- ═══ LETTERBOX TOP BAR ═══ -->
<div class="letterbox-top fade-bars">
  <span class="bar-text">Maple Moon</span>
</div>

<!-- ═══ LETTERBOX BOTTOM BAR ═══ -->
<div class="letterbox-bottom fade-bars">
  <img src="assets/icon_organic.svg" alt="Organic" width="20" height="20" loading="eager" decoding="async">
  <img src="assets/icon_vegan.svg" alt="Vegan" width="20" height="20" loading="eager" decoding="async">
  <img src="assets/icon_caffeine_free.svg" alt="Caffeine Free" width="20" height="20" loading="eager" decoding="async">
  <img src="assets/icon_gluten_free.svg" alt="Gluten Free" width="20" height="20" loading="eager" decoding="async">
  <img src="assets/icon_made_in_aus.svg" alt="Made in Australia" width="20" height="20" loading="eager" decoding="async">
  <span class="shipping-text">Free shipping over $99</span>
</div>

<!-- ═══ CINEMA VIEWPORT ═══ -->
<main class="cinema-viewport" id="main" tabindex="-1">
  <div class="cinema-bg">
    <img src="assets/hero_shots/hero_bar_lineup.jpg" alt="" aria-hidden="true" width="1536" height="1024" fetchpriority="high" decoding="async" loading="eager">
  </div>

  <div class="cinema-content">
    <img src="assets/carob_wordmark.svg" alt="Maple Moon carob wordmark" class="cinema-wordmark fade-1" id="wordmark" width="800" height="200">
    <h1 class="cinema-tagline fade-2">Not chocolate. Its own thing.</h1>
    <p class="cinema-origin fade-3">Handmade in Byron Bay</p>
    <a href="/shop" class="cinema-enter fade-4">Enter</a>
  </div>
</main>

<!-- Desktop parallax on wordmark -->
<script>
(function() {
  if (window.innerWidth < 768) return;
  var wordmark = document.getElementById('wordmark');
  if (!wordmark) return;

  var maxShift = 10;

  document.addEventListener('mousemove', function(e) {
    requestAnimationFrame(function() {
      var cx = window.innerWidth / 2;
      var cy = window.innerHeight / 2;
      var dx = (e.clientX - cx) / cx;
      var dy = (e.clientY - cy) / cy;
      wordmark.style.transform = 'translateX(' + (dx * maxShift) + 'px) translateY(' + (dy * maxShift) + 'px)';
    });
  }, { passive: true });
})();
</script>

</body>
</html>
