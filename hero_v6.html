<style>


  :root {
    --split: 50;
    --z-product: 2;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: var(--mm-sans);
    color: var(--mm-cream);
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--mm-navy);
  }

  /* skip-link, focus-visible, reduced-motion → brand_kit.css */

  @media (prefers-reduced-motion: no-preference) {
    .fade-1 { animation: fadeIn 0.6s ease both 0.1s; }
    .fade-2 { animation: fadeIn 0.6s ease both 0.25s; }
    .fade-3 { animation: fadeIn 0.6s ease both 0.4s; }
    .fade-4 { animation: fadeIn 0.6s ease both 0.55s; }
    .fade-5 { animation: fadeIn 0.6s ease both 0.7s; }
    .fade-6 { animation: fadeIn 0.6s ease both 0.85s; }
  }

  /* -- Back link -- */
  .back-link {
    position: fixed; top: 12px; left: 56px; z-index: calc(var(--z-fixed) + 1);
    color: var(--mm-cream); text-decoration: none;
    font-family: var(--mm-sans); font-size: 0.8rem; font-weight: 400;
    opacity: 0.7; transition: opacity 0.2s;
    display: block; min-height: 44px; padding: 12px 8px;
  }
  .back-link:hover { opacity: 1; }

  /* -- Hamburger (mobile) -- */
  #menu-toggle { display: none; }

  .hamburger {
    position: fixed; top: 12px; left: 12px; z-index: var(--z-tooltip);
    cursor: pointer; display: flex; flex-direction: column;
    justify-content: center; gap: 5px; width: 44px; height: 44px;
    padding: 8px;
  }
  .hamburger span {
    display: block; width: 100%; height: 2px;
    background: var(--mm-cream); border-radius: 1px;
    transition: transform 0.3s, opacity 0.3s;
  }
  #menu-toggle:checked ~ .hamburger span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
  #menu-toggle:checked ~ .hamburger span:nth-child(2) { opacity: 0; }
  #menu-toggle:checked ~ .hamburger span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

  #main-content:focus { outline: none; }

  .menu-close {
    position: absolute; top: 20px; right: 20px;
    background: none; border: none; cursor: pointer;
    font-size: 1.5rem; color: var(--mm-navy); opacity: 0.5;
    padding: 12px; min-width: 44px; min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s;
  }
  .menu-close:hover { opacity: 1; }

  /* -- Mobile menu overlay -- */
  .mobile-menu {
    position: fixed; inset: 0; z-index: var(--z-modal);
    background: var(--mm-cream); color: var(--mm-navy);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 28px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #menu-toggle:checked ~ .mobile-menu { opacity: 1; pointer-events: auto; }

  .mobile-menu a {
    font-family: var(--mm-serif); font-size: 1.4rem;
    font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--mm-navy); text-decoration: none;
    transition: opacity 0.2s;
    min-height: 44px; padding: 12px 0;
    display: inline-flex; align-items: center;
  }
  .mobile-menu a:hover { opacity: 0.6; }

  .mobile-menu .menu-divider {
    width: 40px; height: 1px; background: var(--mm-navy); opacity: 0.2;
  }
  .mobile-menu .menu-nav {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    margin-top: 24px; padding-top: 24px;
    border-top: 1px solid var(--mm-navy-15);
  }
  .mobile-menu .menu-nav a {
    font-family: var(--mm-sans); font-size: 0.95rem;
    font-weight: 400; text-transform: none; letter-spacing: 0.02em;
    color: var(--mm-navy); opacity: 0.6;
  }

  /* -- Mobile header -- */
  .header-mobile {
    position: fixed; top: 0; left: 0; right: 0; z-index: var(--z-fixed);
    display: flex; justify-content: flex-end; align-items: flex-start;
    padding: 20px;
  }
  .header-mobile .logo-img { width: 72px; height: auto; }

  /* -- CAROB watermark full-width override -- */
  .carob-watermark-wrap img { width: 110%; max-width: none; }

  /* -- Remove bottom category bars -- */
  .category-strip, .category-bar-desktop { display: none !important; }

  /* -- Desktop nav -- */
  .header-desktop { display: none; }

  /* =============================================
     BEFORE & AFTER LAYOUT
     ============================================= */

  /* -- MOBILE: stacked layout -- */
  .split-hero {
    position: relative; width: 100%; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .split-left {
    position: relative;
    width: 100%; height: 50vh;
    overflow: hidden;
  }
  .split-left-bg {
    position: absolute; inset: 0;
    background: url('assets/hero_shots/hero_carob_pods_hand.png') center/cover no-repeat;
  }
  .split-left-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(20,30,60,0.15) 0%, rgba(10,15,40,0.40) 100%);
  }
  .split-left-text {
    position: absolute; bottom: 32px; left: 24px;
    transform: none;
    font-family: var(--mm-serif);
    font-size: 5.5rem; font-weight: 400;
    letter-spacing: 0.03em; line-height: 1.15;
    color: var(--mm-cream); z-index: var(--z-product);
    text-shadow: 0 2px 12px var(--mm-black-35);
    text-align: left; white-space: nowrap;
  }

  .split-right {
    position: relative;
    width: 100%; flex: 1;
    overflow: hidden;
  }
  .split-right-bg {
    position: absolute; inset: 0;
    background: url('assets/hero_shots/hero_carob_bar_hand.png') center/cover no-repeat;
  }
  .split-right-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(30,40,70,0.25) 0%, rgba(20,30,60,0.50) 100%);
  }
  .split-right-text {
    position: absolute; bottom: 32px; right: 24px;
    transform: none;
    font-family: var(--mm-serif);
    font-size: 5.5rem; font-weight: 400;
    letter-spacing: 0.03em; line-height: 1.15;
    color: var(--mm-cream); z-index: var(--z-product);
    text-shadow: 0 2px 12px var(--mm-black-35);
    text-align: right; white-space: nowrap;
    left: auto;
  }

  /* Brand voice tagline — removed from DOM */

  /* Divider (hidden on mobile) */
  .split-divider {
    display: none;
  }

  /* CTA — removed from DOM */

  /* -- Category strip (mobile) -- */
  .category-strip {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: var(--z-dropdown);
    padding: 18px 0 28px;
    overflow-x: auto; overflow-y: hidden;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x mandatory;
    mask-image: linear-gradient(to right, transparent 0%, black 8%, black 85%, transparent 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 85%, transparent 100%);
    text-align: center;
  }
  .category-strip .inner {
    display: inline-flex; align-items: center; gap: 0;
    padding: 0 24px;
  }
  .category-strip a {
    scroll-snap-align: center;
    font-family: var(--mm-serif); font-size: 0.75rem;
    font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--mm-cream); text-decoration: none;
    padding: 10px 0; min-height: 44px; white-space: nowrap;
    transition: opacity 0.2s;
    display: inline-flex; align-items: center;
  }
  .category-strip a:hover { opacity: 0.7; }
  .category-strip .dot {
    display: inline-block; width: 4px; height: 4px;
    background: var(--mm-cream); border-radius: var(--radius-full);
    margin: 0 12px; opacity: 0.5; flex-shrink: 0;
  }

  /* -- Desktop category bar -- */
  .category-bar-desktop { display: none; }

  /* =============================================
     DESKTOP (768px+)
     ============================================= */
  @media (min-width: 768px) {
    .hamburger { display: none; }
    .header-mobile { display: none; }
    .category-strip { display: none; }
    .back-link { display: block; left: 12px; }

    /* Desktop nav */
    .header-desktop {
      display: flex; align-items: center;
      position: fixed; top: 0; left: 0; right: 0; z-index: var(--z-fixed);
      padding: 16px 40px;
      transition: background 0.3s ease, backdrop-filter 0.3s ease;
    }
    .header-desktop.scrolled {
      backdrop-filter: blur(8px) saturate(120%);
      -webkit-backdrop-filter: blur(8px) saturate(120%);
      background: rgba(123, 157, 191, 0.6);
      border-bottom: 1px solid rgba(231,228,202,0.1);
    }
    .header-desktop nav {
      flex: 1; display: flex; align-items: center;
      justify-content: center; gap: 40px;
    }
    .header-desktop nav a {
      font-family: var(--mm-sans); font-size: 0.85rem;
      font-weight: 400; letter-spacing: 0.07em;
      color: var(--mm-cream); text-decoration: none;
      opacity: 0.7; transition: opacity 0.2s;
    }
    .header-desktop nav a:hover { opacity: 0.6; }
    .header-desktop .logo-desktop {
      width: 160px; height: auto; margin-left: auto; flex-shrink: 0;
    }

    /* Split layout: side-by-side */
    .split-hero {
      flex-direction: row;
      height: 100vh; height: 100dvh;
    }

    .split-left {
      width: calc(var(--split) * 1%);
      height: 100%;
      flex: none;
      transition: width 0.05s linear;
    }
    .split-left-text {
      font-size: 8rem;
      bottom: 48px;
      left: 48px;
    }

    .split-right {
      width: calc((100 - var(--split)) * 1%);
      height: 100%;
      flex: none;
      transition: width 0.05s linear;
    }
    .split-right-text {
      font-size: 8rem;
      bottom: 48px;
      right: 48px;
    }

    /* Divider */
    .split-divider {
      display: block;
      position: absolute;
      top: 0; bottom: 0;
      left: calc(var(--split) * 1%);
      transform: translateX(-50%);
      width: 3px;
      background: var(--mm-cream);
      z-index: var(--z-sticky);
      cursor: ew-resize;
    }
    .split-divider-handle {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 40px; height: 40px;
      border: 2px solid var(--mm-cream);
      border-radius: var(--radius-full);
      background: rgba(30, 67, 102, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 0 0 2px rgba(231,228,202,0.5);
      cursor: ew-resize;
      display: flex; align-items: center; justify-content: center;
    }
    .split-divider-handle::before,
    .split-divider-handle::after {
      content: '';
      position: absolute;
      width: 2px; height: 12px;
      background: var(--mm-cream);
      border-radius: 1px;
    }
    .split-divider-handle::before { left: 8px; }
    .split-divider-handle::after { right: 8px; }

    /* Watermark */

    /* CTA — removed */

    /* Desktop category bar */
    .category-bar-desktop {
      display: flex; align-items: center; justify-content: center; gap: 0;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: var(--z-dropdown);
      padding: 24px 0 32px;
      background: linear-gradient(to top, rgba(0,0,0,0.25) 0%, transparent 100%);
    }
    .category-bar-desktop a {
      font-family: var(--mm-serif); font-size: 1.3rem;
      font-weight: 500; text-transform: uppercase; letter-spacing: 0.15em;
      color: var(--mm-cream); text-decoration: none;
      transition: opacity 0.2s;
    }
    .category-bar-desktop a:hover { opacity: 0.65; }
    .category-bar-desktop .dot {
      display: inline-block; width: 5px; height: 5px;
      background: var(--mm-cream); border-radius: var(--radius-full);
      margin: 0 20px; opacity: 0.4;
    }
  }

  @media (min-width: 1024px) {
    .header-desktop { padding: 16px 48px; }
    .header-desktop nav { gap: 52px; }
  }
</style>

<script>
(function() {
  // Close menu on link click
  const toggle = document.getElementById('menu-toggle');
  var menu = document.querySelector('.mobile-menu');
  var hamburger = document.querySelector('.hamburger');
  document.querySelectorAll('.mobile-menu a').forEach(function(a) {
    a.addEventListener('click', function() {
      toggle.checked = false;
      menu.setAttribute('aria-hidden', 'true');
      hamburger.setAttribute('aria-expanded', 'false');
    });
  });

  // Close button
  var closeBtn = document.querySelector('.menu-close');
  if (closeBtn) {
    closeBtn.addEventListener('click', function() {
      toggle.checked = false;
      toggle.dispatchEvent(new Event('change'));
    });
  }

  // ARIA state on open/close + focus trap
  toggle.addEventListener('change', function() {
    var isOpen = toggle.checked;
    menu.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
    hamburger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    if (!isOpen) { hamburger.focus(); return; }
    var focusable = menu.querySelectorAll('a, button, [tabindex]');
    if (!focusable.length) return;
    var first = focusable[0], last = focusable[focusable.length - 1];
    function trap(e) {
      if (e.key === 'Escape') { toggle.checked = false; toggle.dispatchEvent(new Event('change')); return; }
      if (e.key !== 'Tab') return;
      if (e.shiftKey) { if (document.activeElement === first) { e.preventDefault(); last.focus(); } }
      else { if (document.activeElement === last) { e.preventDefault(); first.focus(); } }
    }
    menu.addEventListener('keydown', trap);
    first.focus();
    var observer = new MutationObserver(function() {
      if (!toggle.checked) { menu.removeEventListener('keydown', trap); observer.disconnect(); }
    });
    observer.observe(toggle, { attributes: true });
  });

  // Desktop split divider drag
  var divider = document.querySelector('.split-divider');
  if (!divider) return;

  var isDragging = false;
  var hero = document.querySelector('.split-hero');

  function updateSplit(clientX) {
    var rect = hero.getBoundingClientRect();
    var pct = ((clientX - rect.left) / rect.width) * 100;
    pct = Math.max(20, Math.min(80, pct));
    document.documentElement.style.setProperty('--split', pct);
    divider.setAttribute('aria-valuenow', Math.round(pct));
  }

  divider.addEventListener('mousedown', function(e) {
    isDragging = true;
    e.preventDefault();
    document.body.style.cursor = 'ew-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    updateSplit(e.clientX);
  });

  document.addEventListener('mouseup', function() {
    if (isDragging) {
      isDragging = false;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    }
  });

  // Touch support for the divider
  divider.addEventListener('touchstart', function(e) {
    isDragging = true;
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchmove', function(e) {
    if (!isDragging) return;
    updateSplit(e.touches[0].clientX);
  }, { passive: true });

  document.addEventListener('touchend', function() {
    isDragging = false;
  });

  // Scroll-based header blur
  window.addEventListener('scroll', function() {
    var h = document.querySelector('.header-desktop');
    if (h) h.classList.toggle('scrolled', window.scrollY > 60);
  });

  // Keyboard support for slider
  divider.addEventListener('keydown', function(e) {
    var current = parseFloat(divider.getAttribute('aria-valuenow')) || 50;
    var step = 5;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
      e.preventDefault();
      current = Math.min(80, current + step);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      e.preventDefault();
      current = Math.max(20, current - step);
    } else if (e.key === 'Home') {
      e.preventDefault();
      current = 20;
    } else if (e.key === 'End') {
      e.preventDefault();
      current = 80;
    } else {
      return;
    }
    document.documentElement.style.setProperty('--split', current);
    divider.setAttribute('aria-valuenow', Math.round(current));
  });
})();
</script>
</body>
